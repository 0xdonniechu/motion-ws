<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #efe9dc; }
      body { font-family: system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      #root { position: relative; width: 1080px; height: 1920px; }
      .clip { position: absolute; inset: 0; }
      .grid-bg {
        position: absolute; inset: 0;
        background-image: repeating-linear-gradient(0deg, #e2d9c6 0 1px, transparent 1px 60px),
                          repeating-linear-gradient(90deg, #e2d9c6 0 1px, transparent 1px 60px);
      }
      .big {
        font-weight: 900; color: #e8542f; text-align: center; line-height: 1.08;
        -webkit-text-stroke: 2px #fff;
        text-shadow: 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff;
      }
      .sub { text-align: center; color: #333; font-weight: 700; }
      .card {
        background: #fff; border-radius: 28px; border: 3px solid #222;
        box-shadow: 0 10px 0 rgba(0,0,0,.15);
      }
      .bar { display: flex; gap: 12px; align-items: center; padding: 22px 28px; border-bottom: 3px solid #222; }
      .cdot { width: 22px; height: 22px; border-radius: 50%; }
      /* shot 1 */
      #s1browser { position: absolute; left: 90px; top: 240px; width: 900px; height: 640px; }
      #s1badge {
        position: absolute; left: 120px; top: 120px; background: #1c1c1c; color: #ffd23f;
        font-size: 44px; padding: 16px 30px; border-radius: 18px; font-weight: 800;
      }
      #s1pill {
        position: absolute; left: 560px; top: 420px; background: #e8542f; color: #fff;
        font-size: 40px; padding: 14px 30px; border-radius: 40px; font-weight: 800;
      }
      #s1t { position: absolute; top: 1020px; width: 1080px; font-size: 128px; }
      #s1s { position: absolute; top: 1320px; width: 1080px; font-size: 52px; }
      /* shot 2 */
      #s2term { position: absolute; left: 90px; top: 200px; width: 900px; height: 520px; background: #1c1c1c; border-radius: 28px; padding: 30px 36px; color: #7dd87f; font-size: 34px; line-height: 2; }
      #s2term .w { color: #f2f2f2; } #s2term .cur { background: #7dd87f; color: #1c1c1c; padding: 0 8px; }
      #s2t { position: absolute; top: 840px; width: 1080px; font-size: 118px; }
      #s2s { position: absolute; top: 1220px; width: 1080px; font-size: 50px; }
      /* shot 3 */
      #s3svg { position: absolute; left: 90px; top: 380px; }
      #s3t { position: absolute; top: 80px; width: 1080px; font-size: 110px; }
      #s3s { position: absolute; top: 1480px; width: 1080px; font-size: 50px; }
      /* shot 4 */
      #s4t { position: absolute; top: 560px; width: 1080px; font-size: 124px; }
      #s4s { position: absolute; top: 900px; width: 1080px; font-size: 54px; }
      #s4cta { position: absolute; top: 1180px; left: 140px; width: 800px; background: #1c1c1c; color: #fff; font-size: 44px; border-radius: 24px; padding: 34px 40px; text-align: center; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20"
         data-width="1080" data-height="1920" data-fps="30">
      <div id="shot1" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="grid-bg"></div>
        <div id="s1browser" class="card node">
          <div class="bar"><span class="cdot" style="background:#e8542f"></span><span class="cdot" style="background:#e8b93f"></span><span class="cdot" style="background:#7dd87f"></span></div>
        </div>
        <div id="s1badge" class="mono node">★ 19 NGHÌN SAO</div>
        <div id="s1pill" class="node">mới ra 2 tuần</div>
        <div id="s1t" class="big node">19 NGHÌN<br>SAO</div>
        <div id="s1s" class="sub node">skill vẽ bản tách lớp cho AI</div>
      </div>

      <div id="shot2" class="clip" data-start="5" data-duration="5" data-track-index="1">
        <div class="grid-bg"></div>
        <div id="s2term" class="mono node"><span class="w">></span> Dùng skill anatomy<br>vẽ cái phin cà phê <span class="cur">█</span></div>
        <div id="s2t" class="big node">CÁI PHIN<br>CÀ PHÊ</div>
        <div id="s2s" class="sub node">đồ quen nhất của người Việt</div>
      </div>

      <div id="shot3" class="clip" data-start="10" data-duration="6" data-track-index="1">
        <div class="grid-bg"></div>
        <div id="s3t" class="big node">TẤM NÉN</div>
        <svg id="s3svg" class="node" viewBox="0 0 900 1000" width="900" height="1000">
          <g id="L5"><ellipse cx="380" cy="880" rx="210" ry="34" fill="#ffffff" stroke="#999" stroke-width="3"/><ellipse cx="380" cy="872" rx="150" ry="24" fill="#f2f2f2"/></g>
          <g id="L4"><path d="M250,640 L290,860 Q292,878 310,878 L450,878 Q468,878 470,860 L510,640 Z" fill="#f7f7f7" stroke="#999" stroke-width="3"/><ellipse cx="380" cy="648" rx="128" ry="24" fill="#4a2c17"/></g>
          <g id="L3"><path d="M270,380 L250,600 L510,600 L490,380 Z" fill="#e3e3e3" stroke="#999" stroke-width="3"/><ellipse cx="380" cy="380" rx="120" ry="22" fill="#d0d0d0" stroke="#999" stroke-width="3"/></g>
          <g id="L2"><rect x="286" y="330" width="208" height="52" rx="10" fill="#6b4226"/><ellipse cx="380" cy="330" rx="104" ry="14" fill="#7d5230"/></g>
          <g id="L1"><ellipse cx="380" cy="296" rx="104" ry="20" fill="#f4f4f4" stroke="#999" stroke-width="3"/><line x1="380" y1="276" x2="380" y2="210" stroke="#999" stroke-width="6"/><circle cx="380" cy="200" r="14" fill="#ddd" stroke="#999" stroke-width="3"/></g>
          <g id="L0"><ellipse cx="380" cy="150" rx="150" ry="26" fill="#efefef" stroke="#999" stroke-width="3"/><circle cx="380" cy="118" r="12" fill="#ddd" stroke="#999" stroke-width="3"/></g>
          <g id="plabels" font-family="ui-monospace, Menlo, monospace" font-size="30" fill="#333">
            <line x1="530" y1="150" x2="660" y2="150" stroke="#999" stroke-width="2"/><text x="672" y="161">nắp</text>
            <line x1="484" y1="296" x2="660" y2="296" stroke="#999" stroke-width="2"/><text x="672" y="307">tấm nén</text>
            <line x1="494" y1="356" x2="660" y2="356" stroke="#999" stroke-width="2"/><text x="672" y="367">bột cà phê</text>
            <line x1="500" y1="490" x2="660" y2="490" stroke="#999" stroke-width="2"/><text x="672" y="501">thân phin</text>
            <line x1="500" y1="740" x2="660" y2="740" stroke="#999" stroke-width="2"/><text x="672" y="751">ly</text>
          </g>
        </svg>
        <div id="s3s" class="sub node">đè bột cho nước thấm đều</div>
      </div>

      <div id="shot4" class="clip" data-start="16" data-duration="4" data-track-index="1">
        <div class="grid-bg"></div>
        <div id="s4t" class="big node">CHƯA NỬA<br>TIẾNG</div>
        <div id="s4s" class="sub node">ra bản vẽ bấm được</div>
        <div id="s4cta" class="node">Món tiếp theo tách lớp cái gì?</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s1browser", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#s1badge", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.7);
      tl.fromTo("#s1pill", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.1);
      tl.fromTo("#s1t", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.5);
      tl.fromTo("#s1s", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.2);
      tl.fromTo("#s2term", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.2);
      tl.fromTo("#s2t", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.8);
      tl.fromTo("#s2s", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.5);
      tl.fromTo("#L4", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.2);
      tl.fromTo("#L5", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.6);
      tl.fromTo("#L3", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.0);
      tl.fromTo("#L2", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.4);
      tl.fromTo("#L1", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.8);
      tl.fromTo("#L0", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 12.2);
      tl.fromTo("#plabels", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 12.8);
      tl.fromTo("#s3t", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.2);
      tl.fromTo("#s3s", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 13.8);
      tl.fromTo("#s4t", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 16.2);
      tl.fromTo("#s4s", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 16.9);
      tl.fromTo("#s4cta", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 17.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
