<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#bg { position: absolute; inset: 0; background: #efece6; }
.layer { position: absolute; inset: 0; }

/* lưới halftone nền, mờ dần lên phía trên */
#grid { -webkit-mask-image: linear-gradient(to bottom, transparent 380px, rgba(0,0,0,.55) 760px, #000 1250px);
  mask-image: linear-gradient(to bottom, transparent 380px, rgba(0,0,0,.55) 760px, #000 1250px); }
#grid svg { position: absolute; left: 0; top: 0; }

/* vệt cam nhạt phía trên (tàn dư chuyển cảnh) */
.pale { position: absolute; left: 0; width: 1080px; background: #f0c9b8; opacity: .75; }

#tag { position: absolute; left: 130px; top: 128px; font: 500 26px JBMono, monospace; color: #1a1a1a; }
#cap { position: absolute; left: 130px; top: 248px; width: 900px; font: 500 78px/96px Inter, sans-serif;
  color: #141414; letter-spacing: -1.5px; }
#cap span { display: inline-block; opacity: 0; }
#cap em { font: italic 400 96px ISerif, serif; color: #c9451c; letter-spacing: 0; }
#cap2 { position: absolute; left: 130px; top: 248px; width: 900px; font: 500 78px/96px Inter, sans-serif;
  color: #141414; letter-spacing: -1.5px; }
#cap2 span { display: inline-block; opacity: 0; }

/* hào quang cream trong vòng */
#glow { position: absolute; left: 140px; top: 540px; width: 800px; height: 800px; border-radius: 50%;
  background: radial-gradient(circle closest-side, rgba(255,253,248,.95) 0%, rgba(255,253,248,.9) 70%, rgba(255,253,248,0) 100%); opacity: 0; }

/* chữ lớn */
.line { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Anton, sans-serif; white-space: nowrap; line-height: 1; }
.line span { display: inline-block; will-change: transform; }
#l1 { top: 470px; font-size: 330px; letter-spacing: 0; color: #1b1613; }
#l1 span { text-shadow: 7px 9px 0 #c9451c; }
#l2 { top: 780px; font-size: 450px; letter-spacing: 0; color: #c9451c; }
#l2 span { text-shadow: -8px 8px 0 #151210; }

/* 3 sọc cam */
.bar { position: absolute; left: 0; height: 46px; width: 1080px; background: #c9451c; transform-origin: 0 50%; }

/* vòng halftone: mặt nạ vành * mặt nạ chấm */
#ringWrap { position: absolute; left: 140px; top: 540px; width: 800px; height: 800px; opacity: 0;
  -webkit-mask-image: radial-gradient(circle closest-side, transparent 0, transparent 62%, #000 68%, #000 90%, transparent 100%);
  mask-image: radial-gradient(circle closest-side, transparent 0, transparent 62%, #000 68%, #000 90%, transparent 100%); }
#ringDots { position: absolute; inset: 0; background: #c9451c;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect x='3' y='3' width='38' height='38' rx='9'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><rect x='3' y='3' width='38' height='38' rx='9'/></svg>"); }


/* poster (bìa clip, f1–f3 = 0–0.067s của gốc, đứng yên rồi CẮT sang cảnh): tự vẽ, không chép ảnh gốc */
#poster { background: #efece6; background-image: radial-gradient(rgba(0,0,0,.07) 2.5px, transparent 3px); background-size: 60px 60px; }
#poster > * { position: absolute; }
#poster .pill { background: #141414; color: #fff; font: 700 34px/1 JBMono, monospace; white-space: nowrap; box-shadow: 0 8px 0 rgba(20,20,20,.12); }
#pp-gsap { left: 84px; top: 232px; font: 400 262px/1 Anton, sans-serif; color: #1b1613; transform: rotate(-2deg) scaleX(.92); transform-origin: 0 100%; letter-spacing: -4px; }
#pp-plus { left: 574px; top: 318px; font: 400 130px/1 Anton, sans-serif; color: #1b1613; }
#pp-motion { left: 80px; top: 502px; width: 715px; height: 252px; border-radius: 26px; background: #c9451c; transform: rotate(-3.5deg); box-shadow: 9px 16px 0 #141414; }
#pp-motion b { position: absolute; left: 0; top: -2px; width: 715px; text-align: center; font: 400 238px/252px Anton, sans-serif; color: #fff; text-shadow: 5px 7px 0 #141414; font-weight: 400; }
.pp-tile { background: #fff; border: 5px solid #e9e6df; box-shadow: 8px 12px 0 rgba(20,20,20,.12); }
#pp-t1 { left: 782px; top: 226px; width: 206px; height: 208px; border-radius: 34px; transform: rotate(-6deg); }
#pp-t1 i { position: absolute; left: 30px; top: 30px; width: 140px; height: 138px; background: #0d0d0d; font: italic 400 50px/138px Anton, sans-serif; color: #0ae448; text-align: center; }
#pp-t2 { left: 814px; top: 556px; width: 186px; height: 186px; border-radius: 34px; transform: rotate(-5deg); }
#pp-t2 svg { position: absolute; left: 30px; top: 30px; }
.pp-card { top: 828px; width: 496px; height: 764px; border: 7px solid #141414; border-radius: 34px; background: #f3f0e9; box-shadow: 6px 12px 0 rgba(20,20,20,.14); overflow: hidden; }
#pp-c1 { left: 37px; } #pp-c2 { left: 548px; }
#pp-star { left: 37px; top: 828px; }
#pp-spring { left: 548px; top: 828px; }
#pp-sp { left: 680px; top: 892px; font: 400 118px/1 Anton, sans-serif; color: #141414; letter-spacing: -2px; }
#pp-morph { left: 95px; top: 1466px; width: 383px; height: 60px; border-radius: 30px; font-size: 32px; line-height: 60px; text-align: center; }
#pp-user { left: 60px; top: 1640px; width: 562px; height: 120px; border-radius: 60px; background: #fff; border: 5px solid #141414; font: 800 47px/110px Inter, sans-serif; color: #141414; padding-left: 122px; letter-spacing: -1px; white-space: nowrap; box-shadow: 0 6px 0 rgba(20,20,20,.12); }
#pp-user i { position: absolute; left: 8px; top: 6px; width: 98px; height: 98px; border-radius: 50%; background: #1d2540; border: 4px solid #141414; font: 400 40px/90px Anton, sans-serif; color: #efece6; text-align: center; font-style: normal; }
#pp-foot { left: 60px; top: 1790px; height: 54px; border-radius: 27px; padding: 0 16px; font-size: 22.7px; line-height: 54px; }

/* J1: lớp cam nhoè phủ lên (gradient từ trên xuống) rồi đặc; nằm trong post của s01 */
#ov1 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0;
  background: linear-gradient(to bottom, rgba(207,74,31,.96) 0, rgba(207,74,31,.85) 420px, rgba(207,74,31,.4) 1150px, rgba(207,74,31,0) 1750px); }
#ov2 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; background: #cf4a1f; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1.15" data-width="1080" data-height="1920" data-fps="30">

    <svg width="1080" height="1920" viewBox="0 0 1080 1920"><defs><pattern id="hp" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="38" height="36" rx="9" fill="#e4e0d8"/></pattern></defs><rect width="1080" height="1920" fill="url(#hp)"/></svg>

    <div class="pill" style="left:60px;top:92px;width:262px;height:78px;border-radius:39px"><span style="position:absolute;left:30px;top:30px;width:20px;height:20px;border-radius:50%;background:#fff"></span><span style="position:absolute;left:76px;top:0;line-height:78px;letter-spacing:4px">AI TIPS</span></div>
    <div id="pp-gsap">GSAP</div><div id="pp-plus">+</div>
    <div class="pp-tile" id="pp-t1"><i>GSAP</i></div>
    <div id="pp-motion"><b>MOTION</b></div>
    <div class="pp-tile" id="pp-t2"><svg width="120" height="120" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141414"/><path d="M17 68 L33 36 H46 L30 68Z" fill="#fff"/><path d="M38 68 L54 36 H67 L51 68Z" fill="#fff"/><path d="M59 68 L72 42 Q76 36 70 36 H64 L78 36" fill="#fff"/><circle cx="80" cy="38" r="7" fill="#fff"/></svg></div>
    <div class="pp-card" id="pp-c1"></div><div class="pp-card" id="pp-c2"></div>

      <g transform="translate(248 352)" fill="none" stroke-linejoin="miter">
        <g stroke="#c9451c" stroke-width="3"><polygon id="pp-s1" points="0,-330 78,-110 316,-100 128,40 196,262 0,128 -196,262 -128,40 -316,-100 -78,-110" transform="translate(-14 -22) scale(1.0)"/><polygon points="0,-330 78,-110 316,-100 128,40 196,262 0,128 -196,262 -128,40 -316,-100 -78,-110" transform="translate(-26 -40) scale(1.0)"/><polygon points="0,-330 78,-110 316,-100 128,40 196,262 0,128 -196,262 -128,40 -316,-100 -78,-110" transform="translate(-38 -58) scale(1.0)"/></g>
        <polygon points="0,-250 60,-84 240,-76 98,30 150,200 0,98 -150,200 -98,30 -240,-76 -60,-84" fill="#c9451c" stroke="#141414" stroke-width="3"/></g></svg>
    <svg id="pp-spring" width="496" height="764" viewBox="0 0 496 764" data-layout-ignore>
      <rect x="14" y="174" width="466" height="9" fill="#141414"/>
      <g stroke="#141414" stroke-width="3" fill="none"><polyline points="30,186 21,200 39,214 21,228 39,242 21,256 39,270 21,284 39,298 30,312"/><polyline points="73,186 64,200 82,214 64,228 82,242 64,256 82,270 64,284 82,298 73,312"/><polyline points="116,186 107,200 125,214 107,228 125,242 107,256 125,270 107,284 125,298 116,312"/><polyline points="159,186 150,200 168,214 150,228 168,242 150,256 168,270 150,284 168,298 159,312"/><polyline points="202,186 193,200 211,214 193,228 211,242 193,256 211,270 193,284 211,298 202,312"/><polyline points="245,186 236,200 254,214 236,228 254,242 236,256 254,270 236,284 254,298 245,312"/><polyline points="288,186 279,200 297,214 279,228 297,242 279,256 297,270 279,284 297,298 288,312"/><polyline points="331,186 322,200 340,214 322,228 340,242 322,256 340,270 322,284 340,298 331,312"/><polyline points="374,186 365,200 383,214 365,228 383,242 365,256 383,270 365,284 383,298 374,312"/><polyline points="417,186 408,200 426,214 408,228 426,242 408,256 426,270 408,284 426,298 417,312"/><polyline points="460,186 451,200 469,214 451,228 469,242 451,256 469,270 451,284 469,298 460,312"/></g>
      <g font-family="Anton, sans-serif" text-anchor="middle">
        <rect x="19" y="354" width="84" height="88" rx="14" fill="#2f5bea" stroke="#141414" stroke-width="5"/><text x="61" y="412" font-size="50" fill="#141414">0</text>
        <rect x="110" y="354" width="84" height="88" rx="14" fill="#fff" stroke="#141414" stroke-width="5"/><text x="152" y="412" font-size="50" fill="#1d8a52">0.2</text>
        <rect x="200" y="350" width="88" height="90" rx="14" fill="#e0a312" stroke="#141414" stroke-width="5"/><text x="244" y="408" font-size="50" fill="#141414">0.4</text>
        <rect x="298" y="384" width="84" height="88" rx="14" fill="#fff" stroke="#141414" stroke-width="5"/><text x="340" y="442" font-size="50" fill="#7a3cf0">0.6</text>
        <rect x="392" y="352" width="84" height="88" rx="14" fill="#c9451c" stroke="#141414" stroke-width="5"/><text x="434" y="410" font-size="50" fill="#141414">0.8</text></g></svg>
    <div id="pp-sp">spring</div>
    <div class="pill" id="pp-morph">morphSVG: "#star"</div>
    <div id="pp-user"><i>GH</i>@ghuypham.dev</div>

  </div>
</div>
<script>
const mk = (id, txt) => { document.getElementById(id).innerHTML = [...txt].map(c => `<span>${c}</span>`).join(""); };
mk("l1", "CHUYỂN"); mk("l2", "ĐỘNG");

const tl = gsap.timeline({ paused: true });

// phụ đề: hiện từng từ (xám -> đen), chunk 2 thay chunk 1 lúc 0.8s
const c1 = [0.10, 0.13, 0.20, 0.27, 0.40, 0.53, 0.67];
document.querySelectorAll("#cap span").forEach((s, i) => {
  tl.fromTo(s, { opacity: 0, color: "#77736c" }, { opacity: 1, color: "#141414", duration: 0.12, ease: "power2.out" }, c1[i]);
});
tl.to("#cap", { opacity: 0, duration: 0.04 }, 0.78);
const c2 = [0.80, 0.93];
document.querySelectorAll("#cap2 span").forEach((s, i) => {
  tl.fromTo(s, { opacity: 0, color: "#77736c" }, { opacity: 1, color: "#141414", duration: 0.1, ease: "power2.out" }, c2[i]);
});

// chữ bay vào từng mảnh (lệch trái, xoay, mờ chuyển động) rồi rung
const rot = [-34, 22, -18, 30, -26, 16];
const rot2 = [28, -20, 34, -16];
document.querySelectorAll("#l1 span").forEach((s, i) => {
  const t0 = 0.067 + i * 0.016;   // gốc: mảnh chữ đã bay giữa chừng ở khung 0.067 (bản cũ trễ ~2 khung)
  tl.fromTo(s, { x: -330 + i * 40, y: 70, rotation: rot[i], scale: 0.55, opacity: 0, skewX: -30 },
    { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, skewX: 0, duration: 0.25, ease: "back.out(1.6)" }, t0);
});
document.querySelectorAll("#l2 span").forEach((s, i) => {
  const t0 = 0.083 + i * 0.02;
  tl.fromTo(s, { x: -300 + i * 70, y: 140, rotation: rot2[i], scale: 0.5, opacity: 0, skewX: 30 },
    { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, skewX: 0, duration: 0.26, ease: "back.out(1.5)" }, t0);
});
// ---------- nghiêng + trôi sau khi chữ về chỗ (ECC từng khung trên gốc, 540px -> nhân 2; khung f = t*30) ----------
// gốc KHÔNG rung ở 0.37-0.65: hai dòng chữ nghiêng ngược chiều kim đồng hồ từ từ (CHUYỂN tới -6°, ĐỘNG tới -3°), co ~5%,
// trôi sang phải/xuống; sau 0.73 vòng halftone bùng ra.
const Qf = 1 / 30, Q0 = 1 / 30;
const R1 = [-0.23, -0.66, -1.26, -2.55, -3.33, -3.96, -4.46, -4.92, -5.43, -6.06, -5.56, -4.3, -3.06, -2.8, -2.66, -2.9, -3.2];       // f13..f29
const S1 = [0.998, 0.993, 0.987, 0.975, 0.965, 0.955, 0.945, 0.944, 0.957, 0.998, 1.043, 1.05, 1.054, 1.1, 1.137, 1.13, 1.15];
const X1 = [0.7, 1.8, 3.4, 6.7, 8.3, 9.3, 9.9, 10.1, 10.5, 8.0, 3.3, 2.2, 1.0, -3.7, -8.5, -6.7, -3.1];
const Y1 = [0.4, 1.0, 1.9, 3.9, 5.1, 6.1, 7.1, 8.1, 8.8, 9.9, 9.5, 6.9, 4.3, 3.8, 3.3, 2.9, -3.2];
const R2 = [-0.07, -0.18, -0.37, -0.87, -1.18, -2.11, -2.5, -2.9, -3.0, -3.0, -3.0, -3.0, -3.0, -3.0, -3.0, -3.0, -3.0];
const X2 = [0.9, 2.1, 3.3, 5.0, 5.9, 7.1, 8.3, 9.0, 9.0, 9.0, 9.0, 9.0, 9.0, 9.0, 9.0, 9.0, 9.0];
R1.forEach((r, i) => {
  const t0 = (13 + i - 1) * Qf;
  tl.to("#l1", { rotation: r, scaleX: S1[i], x: X1[i] * 2, y: Y1[i] * 2, duration: Qf, ease: "none" }, t0);
  tl.to("#l2", { rotation: R2[i], scaleX: i < 8 ? 1 - 0.006 * i : 0.95, x: X2[i] * 2, duration: Qf, ease: "none" }, t0);
});

// 0.70 -> 1.0: đo lại từng chữ trên gốc (matchTemplate mặt nạ đen/cam, cửa sổ ±48 px, khung 0.60-0.97; các chữ khác đứng yên dx 0-6, dy 0-12):
// CHUYỂN: chỉ C/H/U nhảy ngang ±45 px (dy ±12) trong 0.70-0.80, mỗi khung một chỗ; ĐỘNG: Ộ và N nhảy dọc 0..+48 px (tâm +24, ±24) 0.73-0.97, Đ dọc ~-9±9, G đứng yên.
// Chỉ áp cho các chữ đó (boil bước 1 khung); mọi chữ còn lại giữ nguyên.
const sp1 = document.querySelectorAll("#l1 span"), sp2 = document.querySelectorAll("#l2 span");
boil(tl, [sp1[0], sp1[1], sp1[2]], { mode: "step", step: 1 / 30, amp: 45, ampY: 12, start: 0.70, end: 0.80, seed: 7 });
boil(tl, [sp2[1], sp2[2]], { mode: "step", step: 1 / 30, axis: "y", amp: 24, biasY: 24, start: 0.733, end: 0.967, seed: 11 });   // y 0..+48 (gốc)
boil(tl, [sp2[0]], { mode: "step", step: 1 / 30, axis: "y", amp: 9, biasY: -9, start: 0.733, end: 0.967, seed: 5 });   // y −18..0 (gốc −9±9)

// 3 sọc cam: kéo vào từ trái (gốc 0.17-0.37, gần tuyến tính), rồi quét RA phải (mép trái chạy sang phải, ease-out ~10 khung, mỗi sọc lệch 1 khung),
// rồi bật lại từ trái lúc vòng bùng ra. Đo từng khung trên gốc (mép trái/phải của mỗi sọc, 540px -> nhân 2; khung f = t*30).
// Dùng clip-path inset (mép phải neo / mép trái neo) thay cho scaleX.
const BARS = {
  b1: { R: { 5: 0, 6: 61, 7: 123, 8: 242, 9: 339, 10: 454, 11: 540 },
        L: { 14: 0, 15: 25, 16: 161, 17: 233, 18: 292, 19: 339, 20: 376, 21: 403, 22: 423, 23: 436, 24: 203, 25: 136, 26: 90, 27: 68, 28: 29, 29: 4, 30: 0 } },
  b2: { R: { 5: 9, 6: 97, 7: 185, 8: 347, 9: 477, 10: 540 },
        L: { 13: 0, 14: 62, 15: 152, 16: 258, 17: 313, 18: 356, 19: 389, 20: 414, 21: 430, 22: 441, 23: 447, 24: 450, 27: 450, 28: 208, 29: 117, 30: 4, 31: 0 } },
  b3: { R: { 4: 0, 5: 63, 6: 181, 7: 299, 8: 514, 9: 540 },
        L: { 12: 0, 13: 99, 14: 184, 15: 254, 16: 334, 17: 373, 18: 402, 19: 423, 20: 436, 21: 445, 22: 448, 23: 450, 28: 450, 29: 453, 30: 49, 31: 0 } },
};
Object.entries(BARS).forEach(([id, { R, L }]) => {
  const keys = [...new Set([...Object.keys(R), ...Object.keys(L)].map(Number))].sort((x, y) => x - y);
  let r = 0, l = 0;
  const clip = () => `inset(0px ${(1080 - r * 2).toFixed(1)}px 0px ${(l * 2).toFixed(1)}px)`;
  tl.set("#" + id, { clipPath: "inset(0px 1080px 0px 0px)" }, 0);
  keys.forEach(f => {
    const nr = R[f] != null ? R[f] : r, nl = L[f] != null ? L[f] : l;
    // giữ nguyên giá trị tới khung trước nếu có khoảng trống (L[24]=450 giữ tới 27)
    tl.to("#" + id, { clipPath: `inset(0px ${(1080 - nr * 2).toFixed(1)}px 0px ${(nl * 2).toFixed(1)}px)`, duration: Q0, ease: "none" }, (f - 1) / 30);
    r = nr; l = nl;
  });
});

// vòng halftone cam bùng ra quanh chữ
tl.fromTo("#ringWrap", { scale: 0.55, opacity: 0 }, { scale: 1.45, opacity: 1, duration: 0.25, ease: "power2.out" }, 0.74);
tl.fromTo("#glow", { scale: 0.5, opacity: 0 }, { scale: 1.5, opacity: 1, duration: 0.22, ease: "power2.out" }, 0.76);
