<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<script src="boil.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#bg { background: #efece6; opacity: 0; }
.layer { position: absolute; inset: 0; }

.cell { position: absolute; width: 334px; height: 334px; border: 5px solid #141414; border-radius: 30px; overflow: hidden; background: #f4f1ea; box-shadow: 0 7px 0 rgba(20,20,20,.22); }
.cell > div, .cell > svg { position: absolute; }
.fill { left: 0; top: 0; width: 324px; height: 324px; }
.t { font-family: JBMono, monospace; white-space: nowrap; }
.pill { position: absolute; padding: 0 12px; height: 30px; line-height: 28px; border-radius: 15px; background: #141414; color: #e0a312; font: 500 17px/30px JBMono, monospace; }
.dkcard { position: absolute; border: 4px solid #141414; border-radius: 16px; box-shadow: 5px 6px 0 #141414; }
.dkcard b { position: absolute; left: 10px; top: 8px; font: 400 40px/1 Anton, sans-serif; color: #fff; }
.row { position: absolute; height: 42px; border-radius: 12px; background: #fbfaf7; box-shadow: 0 3px 0 #c9c4bb; }
.row i { position: absolute; left: 8px; top: 7px; width: 28px; height: 28px; border-radius: 8px; }
.row span { position: absolute; left: 46px; top: 0; font: 600 17px/42px JBMono, monospace; color: #141414; }
.row em { position: absolute; right: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #1d8a52; }
.bc { position: absolute; top: 236px; width: 72px; height: 80px; border-radius: 14px; border: 3px solid #141414; text-align: center; box-shadow: 3px 4px 0 #141414; }
.bc b { display: block; font: 400 36px/44px Anton, sans-serif; margin-top: 2px; }
.bc s { display: block; font: 600 12px Inter, sans-serif; text-decoration: none; margin-top: -2px; }

.dc { border: 3px solid #141414 !important; box-shadow: 4px 5px 0 #141414 !important; }
#wash { position: absolute; left: 28px; top: 598px; width: 1024px; height: 1034px; background: rgba(158,154,148,.86); opacity: 0; border-radius: 28px; }
#skill { position: absolute; left: 150px; top: 1086px; width: 790px; height: 90px; border-radius: 45px; background: #c9451c; border: 5px solid #141414; box-shadow: 0 8px 0 rgba(0,0,0,.35);
  font: 800 46px/80px Inter, sans-serif; color: #fff; text-align: center; letter-spacing: -1px; }
.logo { position: absolute; top: 922px; width: 255px; height: 252px; border-radius: 30px; background: #fff; border: 5px solid #141414; box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: 0; }
#lg { left: 132px; } #lm { left: 430px; }
#lg div { position: absolute; left: 30px; top: 30px; width: 185px; height: 182px; background: #141414; font: 400 62px/182px Anton, sans-serif; font-style: italic; color: #0ae448; text-align: center; }
#lm svg { position: absolute; left: 28px; top: 28px; }
#qm { position: absolute; left: 372px; top: 1180px; font: 400 190px/1 Anton, sans-serif; color: #c9451c; opacity: 0; transform: rotate(-12deg); }
#av { position: absolute; left: 637px; top: 1225px; width: 318px; height: 370px; border-radius: 30px; border: 5px solid #141414; background: #e3dfd7; overflow: hidden; opacity: 0; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
#av .c { position: absolute; left: 39px; top: 70px; width: 240px; height: 240px; border-radius: 50%; background: #1d2540; font: 400 112px/240px Anton, sans-serif; color: #efece6; text-align: center; letter-spacing: 3px; }
#av .s { position: absolute; left: -10px; top: 290px; width: 340px; height: 120px; border-radius: 120px 120px 0 0; background: #141a2e; }
#avn { position: absolute; left: 672px; top: 1578px; height: 44px; padding: 0 24px 0 44px; border-radius: 22px; background: #141414; color: #fff; font: 500 27px/44px JBMono, monospace; opacity: 0; white-space: nowrap; }
#avn::before { content: ""; position: absolute; left: 18px; top: 15px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }

#tag { position: absolute; left: 130px; top: 128px; font: 500 26px JBMono, monospace; color: #1a1a1a; }
#cap { position: absolute; left: 130px; top: 248px; width: 740px; font: 500 78px/1.08 Inter, sans-serif; color: #141414; letter-spacing: -1.5px; }
#cap .grp { position: absolute; left: 0; top: 0; width: 740px; opacity: 0; }
#cap span { display: inline-block; opacity: 0; }
#cap em { font: italic 400 96px ISerif, serif; color: #c9451c; letter-spacing: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1920" data-fps="30">
  <div class="clip layer" id="bg" data-start="0" data-duration="2.8" data-track-index="3"></div>
  <div class="clip layer" id="gridL" data-start="0" data-duration="2.8" data-track-index="0" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow data-layout-ignore></div>
  <div class="clip layer" id="over" data-start="0" data-duration="2.8" data-track-index="1" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow>
    <div id="wash" data-layout-allow-occlusion></div>
    <div id="skill" data-layout-allow-occlusion>Đọc SKILL.md trước khi cài</div>
    <div id="qm" data-layout-ignore>?</div>
    <div class="logo" id="lg" data-layout-allow-occlusion><div data-layout-ignore>GSAP</div></div>
    <div class="logo" id="lm" data-layout-allow-occlusion></div>
    <div id="av" data-layout-allow-occlusion><div class="s"></div><div class="c" data-layout-ignore>GH</div></div>
    <div id="avn" data-layout-allow-occlusion>@ghuypham.dev</div>
  </div>
  <div class="clip layer" id="top" data-start="0" data-duration="2.8" data-track-index="2">
    <div id="tag" data-layout-ignore>AI Tips</div>
    <div id="cap"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const MOTION_SVG = (s, bg) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100">${bg === false ? "" : '<rect width="100" height="100" rx="22" fill="#141414"/>'}
<path d="M17 68 L33 36 H46 L30 68Z" fill="#fff"/><path d="M38 68 L54 36 H67 L51 68Z" fill="#fff"/><path d="M59 68 L72 42 Q76 36 70 36 H64 L78 36" fill="#fff"/><circle cx="80" cy="38" r="7" fill="#fff"/></svg>`;
$("#lm").innerHTML = MOTION_SVG(190);

const gridL = $("#gridL");
const POS = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) POS.push([28 + c * 345, 598 + r * 350]);
const cells = POS.map(([x, y], i) => {
  const d = document.createElement("div"); d.className = "cell"; d.id = "c" + i; d.style.left = x + "px"; d.style.top = y + "px";
  d.setAttribute("data-layout-allow-occlusion", ""); d.setAttribute("data-layout-allow-overlap", ""); d.setAttribute("data-layout-ignore", "");
  gridL.appendChild(d); return d;
});
const DOTS = (c, r, g) => `background-image: radial-gradient(${c} ${r}px, transparent ${r + .6}px); background-size: ${g}px ${g}px;`;

// ---- ô 0: hạt -> chữ GSAP ----
cells[0].innerHTML = `
  <div class="fill" id="p0" style="${DOTS('#c9451c', 5, 17)}"></div>
  <div class="fill" id="p0b" style="${DOTS('#141414', 4, 17)} background-position: 8px 8px; -webkit-mask-image: radial-gradient(circle at 40% 55%, #000 10%, transparent 80%); mask-image: radial-gradient(circle at 40% 55%, #000 10%, transparent 80%);"></div>
  <div class="fill" id="p0g" style="background:#141414"><div class="t" style="position:absolute;left:-36px;top:70px;font:400 230px/1 Anton,sans-serif;font-style:italic;color:#0ae448;letter-spacing:-6px">GSAP</div></div>`;

// ---- ô 1: tròn -> sao -> blob -> tròn -> vuông -> G -> chấm ----
cells[1].innerHTML = `
  <div class="fill" id="h1" style="${DOTS('#141414', 7, 22)}"></div>
  <svg class="fill" id="s1" width="324" height="324" viewBox="0 0 324 324"><g id="g1">
    <polygon id="m3" fill="none" stroke="#141414" stroke-width="2.5"/><polygon id="m2" fill="none" stroke="#c9451c" stroke-width="2.5"/>
    <polygon id="m1" fill="#c9451c" stroke="#141414" stroke-width="5" stroke-linejoin="round"/></g></svg>
  <div class="fill" id="gg" style="opacity:0"><div class="t" style="position:absolute;left:30px;top:-30px;width:270px;text-align:center;font:400 330px/1 Anton,sans-serif;color:#c9451c;-webkit-text-stroke:5px #141414;text-shadow:7px 7px 0 #141414">G</div></div>
  <div class="fill" id="od" style="opacity:0;${DOTS('#c9451c', 6, 14)}"></div>
  <div class="fill" id="of" style="opacity:0;background:#c9451c;"><div class="fill" style="${DOTS('#a83a15', 5, 12)}"></div><div class="fill" style="background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.75) 0, transparent 55%)"></div></div>
  <div class="fill" id="ht" style="opacity:0;background:#efece6;${DOTS('#8d8a86', 8, 18)}"></div>`;
const N = 60, CX = 162, CY = 162;
const ring = (f) => { const a = []; for (let i = 0; i < N; i++) { const t = -Math.PI / 2 + i / N * 2 * Math.PI; const [x, y] = f(t); a.push([CX + x, CY + y]); } return a; };
function resample(v) {
  const per = []; let tot = 0;
  for (let i = 0; i < v.length; i++) { const a = v[i], b = v[(i + 1) % v.length]; const d = Math.hypot(b[0] - a[0], b[1] - a[1]); per.push(d); tot += d; }
  const out = [];
  for (let k = 0; k < N; k++) { let d = k / N * tot, i = 0; while (d > per[i]) { d -= per[i]; i++; } const a = v[i], b = v[(i + 1) % v.length], f = d / per[i]; out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); }
  return out;
}
const star = []; for (let i = 0; i < 10; i++) { const t = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 66 : 150; star.push([CX + r * Math.cos(t), CY + r * Math.sin(t)]); }
const SHP = [
  ring((t) => [138 * Math.cos(t), 138 * Math.sin(t)]),
  resample(star),
  ring((t) => { const r = 128 + 16 * Math.sin(5 * t) + 10 * Math.sin(2 * t); return [r * Math.cos(t), r * Math.sin(t)]; }),
  ring((t) => [138 * Math.cos(t), 138 * Math.sin(t)]),
  ring((t) => { const c = Math.cos(t), s = Math.sin(t), p = 5; return [128 * Math.sign(c) * Math.pow(Math.abs(c), 2 / p), 128 * Math.sign(s) * Math.pow(Math.abs(s), 2 / p)]; })];
const cur = { k: 0 };
function drawShape() {
  const i = Math.min(3, Math.floor(cur.k)), f = cur.k - i;
  const pts = SHP[i].map((p, j) => [p[0] + (SHP[i + 1][j][0] - p[0]) * f, p[1] + (SHP[i + 1][j][1] - p[1]) * f]);
  const fmt = (s) => pts.map(p => `${(CX + (p[0] - CX) * s).toFixed(1)},${(CY + (p[1] - CY) * s).toFixed(1)}`).join(" ");
  $("#m1").setAttribute("points", fmt(1)); $("#m2").setAttribute("points", fmt(1.07)); $("#m3").setAttribute("points", fmt(1.14));
}
drawShape();

// ---- ô 2: Tasks -> spring ----
function springHTML(title) {
  let s = `<div class="fill" style="background:#efece6"></div><div style="left:0;top:0;width:324px;height:14px;background:#141414"></div>`;
  if (title) s += `<div class="t" style="left:60px;top:-30px;font:400 90px/1 Anton,sans-serif;color:#6b6762">${title}</div>`;
  const cols = ["#2f5bea", "#c9c4bb", "#c9c4bb", "#7a3cf0", "#c9c4bb", "#e0a312", "#c9c4bb", "#1d8a52"];
  cols.forEach((c, k) => {
    const x = 12 + k * 40, len = 100 + ((k * 37) % 70);
    s += `<svg style="position:absolute;left:${x}px;top:14px" width="30" height="${len + 24}" viewBox="-15 0 30 ${len + 24}"><path d="M0 0 ${Array.from({ length: 9 }, (_, q) => `L${q % 2 ? 8 : -8} ${(q + 1) * len / 9}`).join(" ")}" fill="none" stroke="#3a3a3a" stroke-width="3"/><circle cx="0" cy="${len + 8}" r="11" fill="${c}" stroke="#8e8a84" stroke-width="2"/></svg>`;
  });
  s += `<div class="bc" style="left:-10px;background:#2f5bea"></div><div class="bc" style="left:70px;background:#fff;color:#1d8a52"><b>0.2</b><s>bounce</s></div><div class="bc" style="left:152px;background:#e0a312"><b>0.4</b><s>bounce</s></div><div class="bc" style="left:234px;background:#fff;color:#7a3cf0"><b>0.6</b><s>bounce</s></div>`;
  return s;
}
cells[5].innerHTML = springHTML("");
cells[2].innerHTML = `<div class="fill" id="tk" style="background:#141414">
  <div class="t" style="left:18px;top:30px;font:700 30px Inter,sans-serif;color:#fff">Tasks</div>
  <div style="left:262px;top:18px;width:80px;height:60px;border-radius:12px;background:#c9451c"><div class="t" id="badge" style="position:absolute;left:14px;top:2px;font:400 48px/56px Anton,sans-serif;color:#fff">5</div></div>
  <div class="row" id="r0" style="left:-20px;top:100px;width:190px"><i style="background:#e0a312"></i><span>layout</span></div>
  <div class="row" id="r1" style="left:150px;top:100px;width:200px"><i style="background:#1d8a52"></i><span>exit</span><em></em></div>
  <div class="row" id="r2" style="left:-20px;top:150px;width:210px"><i style="background:#2f5bea"></i><span>stagger</span><em></em></div>
  <div class="row" id="r3" style="left:170px;top:156px;width:190px"><i style="background:#7a3cf0"></i><span>initial</span></div>
  <div class="row" id="r4" style="left:-20px;top:204px;width:210px"><i style="background:#2f5bea"></i><span>animate</span><em></em></div></div>
  <div class="fill" id="sp2" style="opacity:0">${springHTML("pring")}</div>`;

// ---- ô 3: khối SCROLL ----
cells[3].innerHTML = `<div class="fill" style="background:#f1eee8"></div>
  <div style="left:0;top:296px;width:324px;height:40px;border-radius:50%;background:radial-gradient(#141414 30%, transparent 70%)"></div>
  <div id="cube" style="left:0;top:0;width:324px;height:324px;perspective:700px">
    <div id="cf" style="position:absolute;left:24px;top:40px;width:210px;height:220px;background:#c9451c;transform:skewY(-5deg);"><div class="t" id="cft" style="position:absolute;left:10px;top:60px;font:400 84px/1 Anton,sans-serif;font-style:italic;color:#fff">SCROLL</div></div>
    <div id="cs" style="position:absolute;left:234px;top:34px;width:100px;height:226px;background:#8f2f10;transform:skewY(10deg);"><div class="t" style="position:absolute;left:12px;top:70px;font:400 60px/1 Anton,sans-serif;color:#fff">SCR</div></div>
  </div>
  <div class="pill" style="left:0;top:14px;color:#e0a312;background:#141414">0.2×</div><div class="pill" style="left:0;top:58px">0.5×</div><div class="pill" style="left:0;top:104px">1×</div><div class="pill" style="left:0;top:274px">product pin</div>`;

// ---- ô 4: lưới đen / chấm cam ----
cells[4].innerHTML = `<div class="fill" id="q0" style="background:#efece6;${DOTS('#c9451c', 8, 18)}"></div>
  <div class="fill" id="q1" style="opacity:0;background:#efece6;${DOTS('#141414', 9, 14)}"></div>
  <div class="fill" id="q2" style="opacity:0;background:#141414;background-image:linear-gradient(#f4f1ea 1.5px, transparent 1.5px),linear-gradient(90deg,#f4f1ea 1.5px, transparent 1.5px);background-size:11px 11px"></div>
  <div class="fill" id="q3" style="opacity:0;background:#6b3a22;${DOTS('#c9451c', 4, 8)}"></div>
  <div class="fill" id="q4" style="opacity:0;background:#c9451c;${DOTS('#8f2f10', 3, 7)}"></div>
  <div class="fill" id="q5" style="opacity:0;background:radial-gradient(circle at 50% 50%, #fff 0, #fff 18%, transparent 55%), #c9451c;"></div>`;
$("#q1").style.webkitMaskImage = "radial-gradient(circle at 50% 50%, #000 40%, transparent 78%)";

// ---- ô 6: KÉO / NÉM / TRƯỢT ----
cells[6].innerHTML = `<div class="fill" style="background:#f1eee8;${DOTS('#d7d2c8', 3, 20)}"></div>
  <div class="dkcard" id="nem" style="left:56px;top:38px;width:104px;height:150px;background:#141414;transform:rotate(-4deg)"><b>NÉM</b></div>
  <div class="dkcard" id="keo" style="left:222px;top:18px;width:104px;height:130px;background:#c9451c;transform:rotate(18deg)"><b>KÉO</b></div>
  <div class="dkcard" id="truot" style="left:140px;top:168px;width:106px;height:128px;background:#7a3cf0;transform:rotate(-2deg)"><b style="font-size:30px">TRƯỢT</b></div>
  <div class="pill" style="left:-8px;top:96px;background:#e0a312;color:#141414;transform:rotate(-8deg)">snap</div>
  <div class="t" style="left:0;top:296px;width:200px;height:28px;background:#141414;color:#e0a312;font:500 17px/28px JBMono,monospace;padding-left:8px">v 3298 px/s</div>`;

// ---- ô 7: logo Motion ----
cells[7].innerHTML = `<div class="fill" style="background:#f1eee8;${DOTS('#d7d2c8', 3, 20)}"></div>
  <div id="mbig" style="left:34px;top:58px;width:262px;height:216px;border-radius:30px;background:#141414;box-shadow:8px 8px 0 #c9451c"><div style="position:absolute;left:30px;top:6px">${MOTION_SVG(200, false)}</div><div class="t" style="position:absolute;left:0;top:164px;width:262px;text-align:center;font:500 20px JBMono,monospace;color:#fff">motion/react</div></div>
  <div class="t" style="left:90px;top:292px;font:500 16px/1 JBMono,monospace;color:#141414">layoutId= 0.6</div>`;

// ---- ô 8: drag ----
cells[8].innerHTML = `<div class="fill" style="background:#17120f"></div>
  <div style="left:36px;top:76px;width:240px;height:240px;border-radius:50%;border:12px solid #3b342d"></div>
  <div class="dkcard" style="left:-30px;top:20px;width:100px;height:120px;background:#f4f1ea;border-color:#17120f;box-shadow:none"></div>
  <div class="dkcard" style="left:110px;top:-30px;width:130px;height:130px;background:#2f5bea;border-color:#17120f;box-shadow:none"></div>
  <div class="dkcard" style="left:262px;top:40px;width:100px;height:120px;background:#e0a312;border-color:#17120f;box-shadow:none"></div>
  <div class="dkcard" id="dg" style="left:104px;top:110px;width:150px;height:150px;background:#c9451c;border-color:#17120f;box-shadow:none"><div class="t" style="position:absolute;left:0;width:142px;top:56px;text-align:center;font:700 38px Inter,sans-serif;color:#141414">drag</div></div>
  <div class="dkcard" style="left:250px;top:176px;width:110px;height:120px;background:#7a3cf0;border-color:#17120f;box-shadow:none"></div>
  <svg id="cs8" style="left:118px;top:192px" width="36" height="40" viewBox="0 0 36 40"><path d="M3 2 L3 30 L11 23 L17 36 L23 33 L17 21 L28 21Z" fill="#fff" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/></svg>`;

// ===== phụ đề =====
const CAPS = [
  { t0: 0, t1: 0.62, w: [["Claude", -1], ["viết", -1], ["<em>đúng</em>", -1], ["cách", -1], ["của", -1], ["từng", -1], ["thư", 0.04], ["viện.", 0.11]] },
  { t0: 0.62, t1: 1.8, w: [["<em>Đọc</em>", 0.63], ["kỹ", 0.76], ["skill", 0.88], ["trước", 1.13], ["khi", 1.25], ["cài.", 1.37]] },
  { t0: 1.8, t1: 99, w: [["Bạn", 1.88], ["thích", 2.0], ["cái", 2.12], ["nào", 2.2], ["hơn?", 2.27]] }];
const tl = gsap.timeline({ paused: true });
const capEl = $("#cap");
CAPS.forEach((g) => {
  const el = document.createElement("div"); el.className = "grp"; capEl.appendChild(el);
  el.innerHTML = g.w.map(([h]) => `<span>${h.replace("<em>", "<em data-layout-ignore>")}</span>`).join(" ");
  tl.set(el, { opacity: 1 }, g.t0);
  if (g.t1 < 50) tl.set(el, { opacity: 0 }, g.t1);
  el.querySelectorAll("span").forEach((s, i) => {
    if (g.w[i][1] < 0) tl.set(s, { opacity: 1 }, 0);
    else tl.fromTo(s, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, g.w[i][1]);
  });
});

// ===== lưới 3x3 bung ra =====
// J15 (gốc 30.4 = t 0): ô giữa hiện trước ở ~0.5 cỡ rồi lớn về chỗ; các ô còn lại bật lên ở ~0.067 (30.467) từ ~0.5 cỡ, về chỗ lúc ~0.2.
// Ngoài các ô là trong suốt: s15 (post 0.15) còn mờ dần phía dưới; nền kem hiện dần.
tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 0.1);   // gốc: s15 (đám hạt) còn hiện tới ~30.5 rồi biến mất cứng
// J15 fix: ô đặc (opacity 1) ngay khi bật, chỉ co giãn (gốc: f913 ô giữa ~0.5, f914 các ô còn lại ~0.85-0.9, f915 đủ cỡ)
