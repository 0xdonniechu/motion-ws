<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
.layer { position: absolute; inset: 0; }
#paper { background: #f3f0e9; background-image: radial-gradient(rgba(0,0,0,.035) 1.5px, transparent 2px); background-size: 8px 8px; }

#luu { position: absolute; left: 130px; top: 454px; font: 400 285px/1 Anton, sans-serif; color: #141414; letter-spacing: -5px; white-space: nowrap; transform-origin: 0 100%; }
#luu span { display: inline-block; text-shadow: 6px 6px 0 rgba(20,20,20,.9); }
#bm { position: absolute; left: 0; top: 0; width: 1080px; height: 800px; }
#amp { position: absolute; left: 150px; top: 728px; font: italic 400 175px/1 ISerif, serif; color: #c9451c; }

#fol { position: absolute; left: 116px; top: 870px; width: 914px; height: 276px; transform-origin: 0 50%; }
#folbg { position: absolute; left: 0; top: 0; width: 914px; height: 276px; border-radius: 14px; background: #c9451c; box-shadow: 8px 10px 0 rgba(20,20,20,.9); transform-origin: 0 50%; }
.ft { position: absolute; left: 0; top: 0; height: 276px; font: 400 232px/270px Anton, sans-serif; color: #fff; white-space: nowrap; text-shadow: 5px 5px 0 rgba(20,20,20,.85); }
#ft1 { left: 8px; }
#ft2 { left: 18px; opacity: 0; font-size: 178px; }
#chk { position: absolute; left: 800px; top: 100px; width: 74px; height: 74px; border-radius: 50%; background: #c9451c; opacity: 0; }
#chk::after { content: ""; position: absolute; left: 25px; top: 13px; width: 16px; height: 32px; border: solid #fff; border-width: 0 7px 7px 0; transform: rotate(40deg); }

#user { position: absolute; left: 134px; top: 1184px; width: 486px; height: 104px; border-radius: 52px; background: #fff; border: 4px solid #141414; box-shadow: 0 6px 0 rgba(20,20,20,.15);
  font: 800 38px/96px Inter, sans-serif; color: #141414; padding-left: 112px; letter-spacing: -.5px; white-space: nowrap; }
#user i { position: absolute; left: 12px; top: 10px; width: 76px; height: 76px; border-radius: 50%; background: #1d2540; border: 3px solid #141414; font: 400 32px/70px Anton, sans-serif; color: #efece6; text-align: center; font-style: normal; }
.ic { position: absolute; top: 1324px; width: 94px; height: 98px; border-radius: 20px; border: 4px solid #141414; background: #fff; box-shadow: 0 5px 0 rgba(20,20,20,.2); }
.ic svg { position: absolute; }

#av { position: absolute; left: 590px; top: 1400px; width: 460px; height: 460px; transform-origin: 50% 100%; }
#av .c { position: absolute; left: 0; top: 0; width: 460px; height: 460px; border-radius: 50%; background: #1d2540; border: 12px solid #141414; box-shadow: 0 14px 0 rgba(20,20,20,.18);
  font: 400 210px/436px Anton, sans-serif; color: #efece6; text-align: center; letter-spacing: 6px; }
#av .hl { position: absolute; left: 70px; top: 40px; width: 150px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.08); transform: rotate(-25deg); }

#cur { position: absolute; left: 0; top: 0; width: 120px; height: 150px; opacity: 0; transform-origin: 0 0; }
.ring { position: absolute; width: 300px; height: 300px; margin: -150px 0 0 -150px; border: 4px solid #c9451c; border-radius: 50%; opacity: 0; }
.dash { position: absolute; width: 5px; height: 26px; margin-left: -2px; background: #c9451c; opacity: 0; border-radius: 3px; }

#ht { position: absolute; inset: 0; pointer-events: none; }
#ht s { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #141414; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3.03" data-width="1080" data-height="1920" data-fps="30">
  <div class="clip layer" id="paper" data-start="0" data-duration="3.03" data-track-index="0"></div>
  <div class="clip layer" id="main1" data-start="0" data-duration="3.03" data-track-index="1" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow>
    <div id="luu"><span>L</span><span>Ư</span><span>U</span></div>
    <svg id="bm" viewBox="0 0 1080 800"><polygon id="bmp" points="548,478 716,486 702,700 628,636 546,694" fill="#c9451c"/></svg>
    <div id="amp">&amp;</div>
    <div id="fol" data-layout-allow-occlusion><div id="folbg"></div>
      <div class="ft" id="ft1">FOLLOW</div><div class="ft" id="ft2">FOLLOWING</div><div id="chk" data-layout-allow-occlusion></div></div>
    <div id="user" data-layout-allow-occlusion><i data-layout-ignore>GH</i>@ghuypham.dev</div>
    <div id="icons"></div>
    <div id="av" data-layout-allow-occlusion><div class="c" data-layout-ignore>GH</div><div class="hl"></div></div>
    <div id="fx" data-layout-allow-occlusion></div>
    <svg id="cur" viewBox="0 0 40 50"><path d="M3 2 L3 38 L12 30 L19 46 L26 43 L19 28 L32 28Z" fill="#fff" stroke="#141414" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
  <div class="clip layer" id="htL" data-start="0" data-duration="3.03" data-track-index="2" data-layout-allow-occlusion data-layout-ignore><div id="ht"></div></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const MOTION_SVG = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141414"/>
<path d="M17 68 L33 36 H46 L30 68Z" fill="#fff"/><path d="M38 68 L54 36 H67 L51 68Z" fill="#fff"/><path d="M59 68 L72 42 Q76 36 70 36 H64 L78 36" fill="#fff"/><circle cx="80" cy="38" r="7" fill="#fff"/></svg>`;
// 3 ô icon nhỏ
const ICONS = [
  [140, `<svg style="left:9px;top:12px" width="64" height="62" viewBox="0 0 106 100"><rect x="10" y="26" width="86" height="56" rx="14" fill="#c9451c"/><rect x="30" y="8" width="8" height="22" fill="#c9451c"/><rect x="68" y="8" width="8" height="22" fill="#c9451c"/><rect x="26" y="44" width="16" height="16" rx="4" fill="#fff"/><rect x="64" y="44" width="16" height="16" rx="4" fill="#fff"/><rect x="0" y="40" width="10" height="26" rx="4" fill="#c9451c"/><rect x="96" y="40" width="10" height="26" rx="4" fill="#c9451c"/></svg>`, "#fff"],
  [256, `<div style="position:absolute;left:0;top:0;width:86px;height:90px;font:400 30px/90px Anton,sans-serif;font-style:italic;color:#0ae448;text-align:center" data-layout-ignore>GSAP</div>`, "#141414"],
  [372, `<div style="position:absolute;left:0;top:0;width:86px;height:90px;display:flex;align-items:center;justify-content:center">${MOTION_SVG(60)}</div>`, "#141414"]];
ICONS.forEach(([x, html, bg], i) => {
  const d = document.createElement("div"); d.className = "ic"; d.id = "ic" + i; d.style.left = x + "px"; d.style.background = bg; d.innerHTML = html;
  d.setAttribute("data-layout-allow-occlusion", ""); $("#icons").appendChild(d);
});

// lưới chấm halftone (xác định)
const COLS = 28, ROWS = 49, GAP = 39;
const ht = $("#ht");
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const d = document.createElement("s"); d.style.left = (c * GAP - 6) + "px"; d.style.top = (r * GAP - 6) + "px"; ht.appendChild(d);
}
const dly = (i) => { const c = i % COLS, r = Math.floor(i / COLS); return (c / COLS * 0.45 + r / ROWS * 0.55) * 0.22; };

const fx = $("#fx");
function burst(id, x, y, t, n) {
  const r = document.createElement("div"); r.className = "ring"; r.style.left = x + "px"; r.style.top = y + "px"; fx.appendChild(r);
  tl.fromTo(r, { scale: 0.3, opacity: 0.9 }, { scale: 1.3, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t);
  for (let k = 0; k < n; k++) {
    const d = document.createElement("div"); d.className = "dash"; d.style.left = x + "px"; d.style.top = y + "px";
    d.style.transform = `rotate(${k * 360 / n + 10}deg) translateY(-150px)`; fx.appendChild(d);
    tl.fromTo(d, { opacity: 1, y: 0 }, { opacity: 0, y: -40, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
  }
}

const tl = gsap.timeline({ paused: true });

// ---- chuyển: halftone đen quét ----
// J16 (gốc 33.0 = t 0): chấm đen nở từ góc trên-trái chéo xuống phủ kín (đen đặc ~t 0.13-0.22) trên s16 (post 0.2),
// rồi co lại cũng từ góc trên-trái, lộ nền kem + LƯU. Ngoài chấm là trong suốt cho tới khi đen phủ kín.
tl.set("#paper, #main1", { opacity: 0 }, 0);
tl.set("#paper, #main1", { opacity: 1 }, 0.18);
// khung đầu (33.0): chấm đã có ở góc trên-trái (cỡ ~1), mép quét chéo xuống dưới-phải
tl.fromTo("#ht s", { scale: (i) => Math.max(0, 0.9 - dly(i) / 0.22 * 1.5) }, { scale: 1.5, duration: 0.07, ease: "none", stagger: (i) => dly(i) * 0.3 }, 0);
tl.fromTo("#ht s", { scale: 1.5 }, { scale: 0, duration: 0.14, ease: "power2.inOut", stagger: (i) => dly(i) * 0.85, immediateRender: false }, 0.2);

// ---- LƯU + bookmark ----
tl.fromTo("#luu span", { yPercent: 40, opacity: 0, rotation: -6 }, { yPercent: 0, opacity: 1, rotation: 0, duration: 0.3, ease: "back.out(1.8)", stagger: 0.05 }, 0.26);
tl.fromTo("#bmp", { scale: 0, transformOrigin: "630px 590px" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.34);
tl.fromTo("#luu", { rotation: -3 }, { rotation: -2, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.3);
burst("b0", 390, 590, 0.42, 10);

// ---- & + FOLLOW ----
tl.fromTo("#amp", { scale: 0, rotation: -20, opacity: 0, transformOrigin: "50% 80%" }, { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0.6);
tl.fromTo("#fol", { scale: 0.3, opacity: 0, rotation: -6, transformOrigin: "0 50%" }, { scale: 1, opacity: 1, rotation: -1.5, duration: 0.3, ease: "back.out(1.7)" }, 0.62);
tl.set("#folbg", { scaleX: 704 / 914 }, 0);
tl.fromTo("#user", { scale: 0.4, opacity: 0, transformOrigin: "0 50%" }, { scale: 1, opacity: 1, duration: 0.26, ease: "back.out(1.7)" }, 0.74);
burst("b1", 470, 1000, 0.7, 12);

// ---- con trỏ bấm -> FOLLOWING ----
tl.set("#cur", { x: 980, y: 1560, opacity: 0, scale: 1 }, 0);
tl.to("#cur", { opacity: 1, duration: 0.1 }, 0.66);
tl.to("#cur", { x: 898, y: 1421, duration: 0.17, ease: "power2.inOut" }, 0.66);
tl.to("#cur", { x: 520, y: 1056, duration: 0.34, ease: "power3.inOut" }, 0.83);
tl.to("#cur", { scale: 0.8, duration: 0.07, ease: "power2.in" }, 1.1);
tl.to("#cur", { scale: 1, duration: 0.1, ease: "power2.out" }, 1.17);
burst("b2", 540, 1060, 1.12, 10);
tl.to("#ft1", { opacity: 0, duration: 0.08 }, 1.12);
tl.fromTo("#ft2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" }, 1.14);
tl.to("#folbg", { scaleX: 1, backgroundColor: "#141414", duration: 0.22, ease: "back.out(1.5)" }, 1.12);
tl.fromTo("#chk", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2.4)" }, 1.3);
tl.to("#cur", { x: 580, y: 1150, duration: 0.5, ease: "power2.inOut" }, 1.3);
tl.to("#cur", { opacity: 0, duration: 0.12 }, 1.72);

// ---- 3 icon nhỏ ----
tl.fromTo(".ic", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(2)", stagger: 0.07 }, 1.62);

// ---- avatar ----
tl.fromTo("#av", { y: 400, scale: 0.8, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.12);
tl.to("#av", { y: -14, rotation: 3, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.55);
tl.to("#av", { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.13);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
