<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
.layer { position: absolute; inset: 0; }

#L { position: absolute; left: 0; top: 0; width: 534px; height: 1920px; overflow: hidden; background: #f1eee8; }
#R { position: absolute; left: 538px; top: 0; width: 542px; height: 1920px; overflow: hidden; background: #f1eee8; }
#div { position: absolute; left: 534px; top: 0; width: 4px; height: 1920px; background: #141414; }

.faint { position: absolute; font: 400 150px/1 Anton, sans-serif; color: #e3dfd7; white-space: nowrap; }

/* trái */
#split { position: absolute; left: -90px; top: 540px; font: 400 330px/1 Anton, sans-serif; color: #141414; white-space: nowrap; }
#split span { display: inline-block; text-shadow: 8px 8px 0 #c9451c; }
#tung { position: absolute; left: -6px; top: 900px; font: 400 150px/1 Anton, sans-serif; color: #c9451c; white-space: nowrap; letter-spacing: 2px; }
#shapes { position: absolute; left: 0; top: 0; }
#gtxt { position: absolute; left: -30px; top: 560px; width: 600px; text-align: center; font: 400 880px/1 Anton, sans-serif; color: #c9451c; -webkit-text-stroke: 8px #141414; text-shadow: 14px 14px 0 #141414; }
#ldots { position: absolute; left: 0; top: 1500px; width: 534px; height: 420px;
  background-image: radial-gradient(#c9451c 12px, transparent 13px); background-size: 46px 46px; }
#gdots { position: absolute; left: 0; top: 520px; width: 534px; height: 900px;
  background-image: radial-gradient(#c9451c 9px, transparent 10px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 52% 48% at 45% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 52% 48% at 45% 50%, #000 55%, transparent 100%); }
#bandbg { position: absolute; left: -20px; top: 1200px; width: 560px; height: 130px; background: #141414; transform-origin: 50% 0; }
#chip { position: absolute; left: -20px; top: 1200px; width: 560px; height: 62px; background: #141414; border-radius: 0 40px 40px 0; overflow: hidden; }
#chip div { position: absolute; left: 24px; top: 0; width: 540px; font: 500 40px/62px JBMono, monospace; color: #fff; white-space: pre; }
#chip.o div { color: #e0a312; }
#chip2 { position: absolute; left: 0; top: 1395px; white-space: nowrap; opacity: 0; }
#chip2 b { display: inline-block; font: 500 26px/60px JBMono, monospace; padding: 0 20px; color: #fff; background: #141414; border-radius: 30px 0 0 30px; }
#chip2 i { display: inline-block; font: 500 26px/60px JBMono, monospace; font-style: normal; padding: 0 20px; color: #fff; background: #c9451c; border: 3px solid #141414; border-radius: 0 30px 30px 0; line-height: 54px; }

/* phải */
#A, #B { position: absolute; left: 0; top: 0; width: 542px; height: 1920px; }
.big { position: absolute; left: -10px; font: 400 250px/1 Anton, sans-serif; white-space: nowrap; }
.big span { background: linear-gradient(#2a2a2a 25%, #a39f99 100%); -webkit-background-clip: text; color: transparent; }
#bigMask { position: absolute; left: 0; top: 330px; width: 542px; height: 330px; overflow: hidden; }
#bigMask .big { top: 70px; }
.tabs { position: absolute; left: -76px; top: 648px; white-space: nowrap; }
.tabs b { display: inline-block; margin-right: 14px; padding: 10px 28px; border-radius: 30px; font: 600 28px Inter, sans-serif; color: #141414; background: #f7f5f0; border: 3px solid #d8d3ca; }
.tabs b.on { background: #141414; color: #fff; border-color: #141414; }
.dc { position: absolute; width: 264px; height: 168px; background: #fff; border: 4px solid #141414; border-radius: 24px; box-shadow: 0 7px 0 #141414; }
.dc i { position: absolute; left: 20px; top: 22px; width: 44px; height: 44px; border-radius: 50%; }
.dc b { position: absolute; left: 80px; top: 28px; width: 130px; height: 12px; border-radius: 6px; background: #141414; box-shadow: 0 22px 0 -2px #d9d5cd; }
.dc u { position: absolute; bottom: 18px; height: 14px; border-radius: 3px; }
#band { position: absolute; left: 0; top: 660px; width: 542px; height: 840px; background: #141414; border-bottom: 6px solid #c9451c; }
.row { position: absolute; height: 76px; background: #fbfaf7; border-radius: 22px; box-shadow: 0 6px 0 #c9c4bb; }
.row i { position: absolute; top: 14px; width: 48px; height: 48px; border-radius: 14px; }
.row span { position: absolute; top: 0; font: 600 28px/76px JBMono, monospace; color: #141414; }
.row em { position: absolute; right: 18px; top: 18px; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 3px solid #1d8a52; }
.row em::after { content: ""; position: absolute; left: 11px; top: 5px; width: 9px; height: 16px; border: solid #1d8a52; border-width: 0 4px 4px 0; transform: rotate(40deg); }
.blur { position: absolute; width: 230px; height: 200px; background: #fbfaf7; border-radius: 30px; box-shadow: 0 8px 0 #ddd8cf; filter: blur(5px); opacity: .6; }
.blur i { position: absolute; left: 28px; top: 30px; width: 46px; height: 46px; border-radius: 50%; }
.blur b { position: absolute; left: 28px; top: 100px; width: 120px; height: 16px; border-radius: 8px; background: #d4d0c8; }

#pbox { position: absolute; left: 135px; top: 792px; width: 800px; height: 222px; background: #fff; border: 3px solid #141414; border-radius: 24px; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
#pbox div { position: absolute; left: 36px; top: 26px; width: 740px; font: 600 38px/48px Inter, sans-serif; color: #141414; letter-spacing: -.5px; }
#ptab { position: absolute; left: 760px; top: 766px; padding: 4px 22px; background: #f7f5f0; border: 3px solid #141414; border-radius: 20px; font: 500 22px JBMono, monospace; color: #6b665f; }

#glogo { position: absolute; left: 150px; top: 1190px; width: 124px; height: 124px; border-radius: 26px; background: #fff; border: 5px solid #141414; box-shadow: 5px 7px 0 #141414; opacity: 0; }
#glogo div { position: absolute; left: 14px; top: 14px; width: 86px; height: 86px; background: #141414; border-radius: 12px; font: 400 36px/86px Anton, sans-serif; color: #0ae448; text-align: center; font-style: italic; }
#mlogo { position: absolute; left: 856px; top: 1190px; width: 124px; height: 124px; border-radius: 26px; background: #fff; border: 5px solid #141414; box-shadow: 5px 7px 0 #141414; opacity: 0; }
#mlogo svg { position: absolute; left: 10px; top: 10px; }

#tag { position: absolute; left: 130px; top: 128px; font: 500 26px JBMono, monospace; color: #1a1a1a; }
#cap { position: absolute; left: 130px; top: 248px; width: 740px; font: 500 78px/1.08 Inter, sans-serif; color: #141414; letter-spacing: -1.5px; }
#cap .grp { position: absolute; left: 0; top: 0; width: 740px; opacity: 0; }
#cap span { display: inline-block; opacity: 0; }
#cap em { font: italic 400 96px ISerif, serif; color: #c9451c; letter-spacing: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.15" data-width="1080" data-height="1920" data-fps="30">
  <div class="clip layer" id="L" data-start="0" data-duration="2.15" data-track-index="0" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow>
    <div class="faint" data-layout-ignore style="left:-40px;top:560px">WORDS CHARS</div>
    <div class="faint" data-layout-ignore style="left:-60px;top:1100px">LINES MASK</div>
    <div class="faint" data-layout-ignore style="left:-30px;top:1250px">STAGGER</div>
    <div id="ldots"></div>
    <div id="split" data-layout-ignore></div>
    <div id="tung" data-layout-ignore>TỪNG KÝ TỰ</div>
    <svg id="shapes" width="534" height="1920" viewBox="0 0 534 1920"><g id="shp">
      <polygon id="e3" fill="none" stroke="#141414" stroke-width="3"/><polygon id="e2" fill="none" stroke="#c9451c" stroke-width="3"/><polygon id="e1" fill="none" stroke="#141414" stroke-width="3"/>
      <polygon id="shMain" fill="#c9451c" stroke="#141414" stroke-width="9" stroke-linejoin="round"/></g></svg>
    <div id="gtxt" data-layout-ignore>G</div>
    <div id="gdots"></div>
    <div id="bandbg"></div><div id="chip"><div id="chipt"></div></div>
    <div id="chip2" data-layout-ignore><b>gsap.timeline()</b><i>&lt;motion.div layout&gt;</i></div>
  </div>
  <div class="clip layer" id="R" data-start="0" data-duration="2.15" data-track-index="1" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow>
    <div id="blurs"></div>
    <div id="A">
      <div id="bigMask"><div class="big" id="bigG" data-layout-ignore><span>GIAO DIỆN</span></div><div class="big" id="bigL" data-layout-ignore><span>layout</span></div></div>
      <div class="tabs" data-layout-ignore><b>All</b><b id="tdes">Design</b><b id="tcode">Code</b></div>
      <div id="cards"></div>
    </div>
    <div id="B">
      <div id="bigMask2" style="position:absolute;left:0;top:330px;width:542px;height:330px;overflow:hidden"><div class="big" style="top:70px;left:-20px" data-layout-ignore><span>THÊM BỚT</span></div></div>
      <div id="band"><div id="rows"></div></div>
    </div>
  </div>
  <div class="clip layer" id="mid" data-start="0" data-duration="2.15" data-track-index="2" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow>
    <div id="div"></div>
    <div id="pbox"><div id="ptxt"></div></div>
    <div id="ptab" data-layout-ignore>Ví dụ minh hoạ</div>
    <div id="glogo"><div>GSAP</div></div>
    <div id="mlogo"></div>
  </div>
  <div class="clip layer" id="top" data-start="0" data-duration="2.15" data-track-index="3">
    <div id="tag" data-layout-ignore>AI Tips</div>
    <div id="cap"></div>
  </div>
</div>
<script>
// ===== dựng tĩnh (xác định) =====
const $ = (s) => document.querySelector(s);
const SYM = "{}<>/\\#$%&*+=01;:";
function scramble(el, text, p) {            // chữ nhiễu ký tự, xác định theo chỉ số
  const n = Math.floor(p * text.length), step = Math.floor(p * 18);
  let out = "";
  for (let i = 0; i < text.length; i++) out += i < n || text[i] === " " ? text[i] : SYM[(i * 7 + step * 3) % SYM.length];
  el.textContent = out;
}
const MOTION_SVG = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141414"/>
<path d="M17 68 L33 36 H46 L30 68Z" fill="#fff"/><path d="M38 68 L54 36 H67 L51 68Z" fill="#fff"/><path d="M59 68 L72 42 Q76 36 70 36 H64 L78 36" fill="#fff"/><circle cx="80" cy="38" r="7" fill="#fff"/></svg>`;
$("#mlogo").innerHTML = MOTION_SVG(94);

// SplitText: ký tự bay vào
const SPL = "SplitText";
$("#split").innerHTML = [...SPL].map(c => `<span>${c}</span>`).join("");
const FLY = [[-300, -200, -60], [260, -300, 70], [-200, 320, -90], [330, 250, 50], [-380, 40, 120], [200, 420, -40], [-120, -380, 80], [360, -80, -110], [-300, 300, 30]];

// 3 + 1 đa giác morph: tròn -> sao -> blob
const N = 72;
function circle(cx, cy, r) { const a = []; for (let i = 0; i < N; i++) { const t = -Math.PI / 2 + i / N * 2 * Math.PI; a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } return a; }
function starPts(cx, cy, R, r) { const v = []; for (let i = 0; i < 10; i++) { const t = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; v.push([cx + rr * Math.cos(t), cy + rr * Math.sin(t)]); } return v; }
function resample(v) {
  const per = []; let tot = 0;
  for (let i = 0; i < v.length; i++) { const a = v[i], b = v[(i + 1) % v.length]; const d = Math.hypot(b[0] - a[0], b[1] - a[1]); per.push(d); tot += d; }
  const out = [];
  for (let k = 0; k < N; k++) {
    let d = k / N * tot, i = 0; while (d > per[i]) { d -= per[i]; i++; }
    const a = v[i], b = v[(i + 1) % v.length], f = d / per[i];
    out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
  }
  return out;
}
function blob(cx, cy, r) { const a = []; for (let i = 0; i < N; i++) { const t = -Math.PI / 2 + i / N * 2 * Math.PI; const rr = r + 46 * Math.sin(3 * t + 1) + 32 * Math.sin(5 * t); a.push([cx + rr * Math.cos(t), cy + rr * Math.sin(t)]); } return a; }
const SH = { c: circle(300, 950, 430), s: resample(starPts(290, 960, 440, 190)), b: blob(300, 950, 400) };
const cur = { k: 0 };   // 0 tròn, 1 sao, 2 blob
function mix(a, b, f) { return a.map((p, i) => [p[0] + (b[i][0] - p[0]) * f, p[1] + (b[i][1] - p[1]) * f]); }
function drawShape() {
  let pts = cur.k <= 1 ? mix(SH.c, SH.s, cur.k) : mix(SH.s, SH.b, cur.k - 1);
  const cx = 295, cy = 950;
  const f = (s) => pts.map(p => `${(cx + (p[0] - cx) * s).toFixed(1)},${(cy + (p[1] - cy) * s).toFixed(1)}`).join(" ");
  $("#shMain").setAttribute("points", f(1)); $("#e1").setAttribute("points", f(1.06)); $("#e2").setAttribute("points", f(1.12)); $("#e3").setAttribute("points", f(1.19));
}
drawShape();

// thẻ dashboard (cột phải, trạng thái A)
const cardsEl = $("#cards");
const CCOL = ["#1d8a52", "#7a3cf0", "#e0a312", "#2f5bea"];
const GRID = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 2; c++) GRID.push([c * 284 - 6, 744 + r * 186]);
const PERM = [3, 0, 5, 2, 7, 4, 9, 6, 1, 8];
for (let i = 0; i < 10; i++) {
  const d = document.createElement("div"); d.className = "dc"; d.id = "dc" + i;
  const col = CCOL[i % 4];
  d.innerHTML = `<i style="background:${col}"></i><b></b>` + [0, 1, 2, 3, 4].map(k => `<u style="left:${22 + k * 40}px;width:28px;height:${14 + ((i * 3 + k * 5) % 5) * 9}px;background:${CCOL[(i + k) % 4]}"></u>`).join("");
  d.style.left = GRID[i][0] + "px"; d.style.top = GRID[i][1] + "px";
  cardsEl.appendChild(d);
}
// bảng Tasks (trạng thái B)
const ROWS = [["layout", "#e0a312", 20, 720], ["exit", "#1d8a52", 250, 800], ["stagger", "#2f5bea", 20, 900], ["initial", "#7a3cf0", 230, 980],
  ["animate", "#2f5bea", 20, 1090], ["useSpring", "#7a3cf0", 200, 1200], ["popLayout", "#7a3cf0", 90, 1310]];
ROWS.forEach(([t, col, x, y], i) => {
  const r = document.createElement("div"); r.className = "row"; r.id = "rw" + i; r.setAttribute("data-layout-allow-occlusion",""); r.setAttribute("data-layout-allow-overlap","");
  r.style.left = x + "px"; r.style.top = (y - 660) + "px"; r.style.width = "300px";
  r.innerHTML = `<i style="left:14px;background:${col}"></i><span style="left:74px">${t}</span><em></em>`;
  $("#rows").appendChild(r);
});
// UI mờ ở đáy
const BL = [[-60, 1560, "#7b6cf0"], [210, 1600, "#3fae7a"], [-20, 1760, "#e0a312"], [250, 1790, "#4b7bec"]];
BL.forEach(([x, y, c]) => { const d = document.createElement("div"); d.className = "blur"; d.style.left = x + "px"; d.style.top = y + "px"; d.innerHTML = `<i style="background:${c}"></i><b></b>`; $("#blurs").appendChild(d); });
$("#ldots").style.opacity = 0;

// phụ đề
const CAPS = [
  { t0: 0.1, t1: 1.22, w: [["Rồi", 0.085], ["chỉ", 0.3], ["cần", 0.4], ["tả", 0.52], ["bằng", 0.63], ["<em>lời,</em>", 0.78]] },
  { t0: 1.22, t1: 99, w: [["Claude", 1.25], ["viết", 1.4], ["<em>đúng</em>", 1.64], ["cách", 1.76], ["của", 1.86], ["từng", 1.92]] }];

// ===== timeline =====
const tl = gsap.timeline({ paused: true });
const capEl = $("#cap");
CAPS.forEach((g, gi) => {
  const el = document.createElement("div"); el.className = "grp"; capEl.appendChild(el);
  el.innerHTML = g.w.map(([h]) => `<span>${h.replace("<em>", "<em data-layout-ignore>")}</span>`).join(" ");
  tl.set(el, { opacity: 1 }, g.t0);
  if (g.t1 < 50) tl.set(el, { opacity: 0 }, g.t1);
  el.querySelectorAll("span").forEach((s, i) => tl.fromTo(s, { opacity: 0, y: g.w[i][1] === 0.085 ? 0 : 14 }, { opacity: 1, y: 0, duration: g.w[i][1] === 0.085 ? 0.01 : 0.14, ease: "power2.out" }, g.w[i][1]));
});

// J14: gốc cắt cứng sang nền kem ở 28.5 (t = 0.1); 0 – 0.1 trong suốt để s14 (post) còn mờ dần phía dưới.
tl.set("#L, #R, #mid, #top", { opacity: 0 }, 0);
tl.set("#top", { opacity: 1 }, 0.1);
// gốc: khung 855 (28.5) còn kem trống, nội dung vào từ khung 856
tl.set("#L, #R, #mid", { opacity: 1 }, 0.1334);

// ---- trái: SplitText bay vào rồi tan ----
tl.fromTo("#split span", { x: (i) => FLY[i][0], y: (i) => FLY[i][1], rotation: (i) => FLY[i][2], opacity: 0 },
  { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(1.5)", stagger: 0.025 }, 0.08);
tl.fromTo("#tung", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 0.16);
tl.to("#split span", { x: (i) => FLY[(i + 3) % 9][0] * 0.8, y: (i) => FLY[(i + 3) % 9][1] * 0.8, rotation: (i) => FLY[i][2] * 1.4, opacity: 0, duration: 0.25, ease: "power2.in", stagger: 0.015 }, 0.5);
tl.to("#tung", { opacity: 0, y: 40, duration: 0.2, ease: "power2.in" }, 0.5);
const tx = { p: 0 };
function chipTo(text, t, dur) { tl.fromTo(tx, { p: 0 }, { p: 1, duration: dur, ease: "none", immediateRender: false, onUpdate() { scramble($("#chipt"), text, tx.p); } }, t); }
scramble($("#chipt"), "type: chars", 0);
chipTo("type: chars", 0.05, 0.25);
tl.to("#chip", { y: 228, duration: 0.18, ease: "power3.inOut" }, 0.56);
tl.to("#bandbg", { scaleY: 0, duration: 0.18, ease: "power3.inOut" }, 0.56);
tl.set("#chipt", { y: 0 }, 0);
chipTo('morphSVG: "#circle"', 0.6, 0.2);
chipTo('morphSVG: "#star"', 0.95, 0.15);
chipTo('morphSVG: "#blob"', 1.22, 0.15);
chipTo('morphSVG: "#G"', 1.5, 0.18);

// ---- trái: hình morph ----
tl.fromTo("#shp", { scale: 0, transformOrigin: "295px 950px" }, { scale: 1, duration: 0.3, ease: "back.out(1.3)" }, 0.5);
tl.to(cur, { k: 1, duration: 0.2, ease: "power2.inOut", onUpdate: drawShape }, 0.9);
tl.to("#shp", { rotation: 8, duration: 0.5, ease: "sine.inOut", transformOrigin: "295px 950px" }, 0.95);
tl.to(cur, { k: 2, duration: 0.22, ease: "power2.inOut", onUpdate: drawShape }, 1.2);
tl.to("#e1,#e2,#e3", { opacity: 0.3, duration: 0.2 }, 1.2);
tl.fromTo("#gtxt", { opacity: 0, scale: 0.8, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.5)" }, 1.45);
tl.to("#shp", { scale: 0.7, opacity: 0, duration: 0.2, ease: "power2.in", transformOrigin: "295px 950px" }, 1.45);
tl.fromTo("#gdots", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.82);
tl.to("#gtxt", { opacity: 0, duration: 0.12 }, 1.84);
// J15 (post 0.15): đám chấm cam nở ra; chip/logo/hộp lời nhắc/cột phải mờ dần; s16 bung lưới 3x3 đè lên
tl.fromTo("#gdots", { scale: 1, transformOrigin: "45% 50%" }, { scale: 1.25, duration: 0.25, ease: "power1.out", immediateRender: false }, 1.85);
tl.to("#chip2, #glogo, #mlogo", { opacity: 0, duration: 0.1 }, 1.95);
tl.to("#pbox", { opacity: 0, duration: 0.08 }, 2.0);
tl.to("#R, #div", { opacity: 0, duration: 0.1 }, 2.05);
tl.to("#L", { opacity: 0, duration: 0.1 }, 2.05);
tl.to("#ldots", { opacity: 0.9, duration: 0.2 }, 0.55);
tl.to("#ldots", { opacity: 0, duration: 0.25 }, 1.0);
tl.fromTo("#chip2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.14, ease: "power2.out" }, 1.84);
tl.to("#chip", { opacity: 0, duration: 0.1 }, 1.84);
tl.fromTo("#glogo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, 1.86);
tl.fromTo("#mlogo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, 1.9);

// ---- phải: GIAO DIỆN -> layout, thẻ xáo trộn, rồi bảng Tasks ----
tl.fromTo("#A", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, 0.1);
tl.fromTo(".dc", { y: 30 }, { y: 0, duration: 0.3, ease: "power2.out", stagger: 0.02 }, 0.12);
tl.fromTo("#bigL", { yPercent: 110 }, { yPercent: 0, duration: 0.25, ease: "power3.out" }, 0.62);
tl.to("#bigG", { yPercent: -110, duration: 0.2, ease: "power3.in" }, 0.55);
tl.set("#bigL", { yPercent: 110 }, 0);
tl.set("#tcode", { background: "#141414", color: "#fff", borderColor: "#141414" }, 0.6);
PERM.forEach((to, i) => tl.to("#dc" + i, { x: GRID[to][0] - GRID[i][0], y: GRID[to][1] - GRID[i][1], duration: 0.4, ease: "power3.inOut" }, 0.55 + i * 0.015));
tl.fromTo("#B", { x: 560 }, { x: 0, duration: 0.3, ease: "power3.inOut" }, 0.92);
tl.to("#A", { x: -140, opacity: 0, duration: 0.3, ease: "power3.inOut" }, 0.92);
tl.fromTo(".row", { scale: 0.6, opacity: 0, transformOrigin: "0 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(1.6)", stagger: 0.07 }, 1.15);
tl.to("#rw1", { x: 300, opacity: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" }, 1.5);
tl.to("#rw3", { y: 120, duration: 0.25, ease: "power3.inOut" }, 1.5);
tl.fromTo("#rw0", { y: 0 }, { y: 6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);

// ---- hộp lời nhắc ----
tl.fromTo("#pbox", { scale: 0.8, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.4)" }, 0.5);
tl.fromTo("#ptab", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.58);
const MSG = "Tiêu đề bay vào từng chữ, thẻ này như lò xo", ty = { n: 0 };
tl.to(ty, { n: 3, duration: 0.05, ease: "none", onUpdate() { $("#ptxt").textContent = MSG.slice(0, Math.round(ty.n)); } }, 0.55);
[[0.75, 11], [0.875, 20], [1.0, 28], [1.125, 36], [1.25, 43]].forEach(([t, n], i, a) => {
  const from = i ? a[i - 1][1] : 3, t0 = i ? a[i - 1][0] : 0.6;
  tl.fromTo(ty, { n: from }, { n, duration: t - t0, ease: "none", immediateRender: false, onUpdate() { $("#ptxt").textContent = MSG.slice(0, Math.round(ty.n)); } }, t0);
});
tl.to("#pbox", { opacity: 0.35, duration: 0.2 }, 1.8);
tl.to("#ptab", { opacity: 0, duration: 0.15 }, 1.8);
tl.to("#div", { backgroundColor: "#bdb7ac", duration: 0.2 }, 0.75);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
