<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">

<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
.layer { position: absolute; inset: 0; }

#paper { background: #efece6; }
#bgdots { background: radial-gradient(#dcd6cb 2px, transparent 2.6px) 0 0 / 40px 40px; opacity: .7; }
#tpaper { position: absolute; left: 0; top: 375px; width: 1080px; height: 640px; background: #efece6; }
#bg { z-index: 0; }
#vel { position: absolute; left: 14px; top: 972px; padding: 6px 22px 6px 14px; font: 500 27px JBMono, monospace; color: #cfc9bd;
  background: #17120f; border-radius: 0 14px 14px 0; opacity: .85; z-index: 40; }
#vel b { color: #e0a312; font-weight: 500; }
#fg { z-index: 60; }

/* ---- nền: đúng bố cục cuối s13 (bảng thẻ KÉO/NÉM + panel đen), khớp-khung J13 ---- */
#board { position: absolute; left: 15px; top: 375px; width: 1050px; height: 585px; border: 3px dashed #aaa398; border-radius: 22px; }
#bdots { position: absolute; left: 15px; top: 375px; width: 1050px; height: 585px; border-radius: 22px;
  background: radial-gradient(#141414 2.4px, transparent 3px) 10px 10px / 34px 34px; opacity: .32; }
.pill { position: absolute; height: 56px; border-radius: 28px; padding: 0 22px; font: 500 26px/50px JBMono, monospace;
  border: 3px solid #141414; white-space: nowrap; }
.pill.k { background: #141414; color: #fff; }
.pill.w { background: #fff; color: #141414; }
.pill.y { background: #e0a312; color: #141414; }

.tc { position: absolute; left: 0; top: 0; border: 5px solid #141414; border-radius: 20px; box-shadow: 7px 9px 0 #141414; overflow: hidden; }
.tc .big { position: absolute; left: 18px; top: 30px; font: 400 104px/1 Anton, sans-serif; letter-spacing: 0; white-space: nowrap; }
.tc .big span { position: relative; display: inline-block; }
.tc .b1, .tc .b2 { position: absolute; left: 20px; height: 11px; border-radius: 6px; }
.tc .b1 { top: 150px; width: 132px; } .tc .b2 { top: 170px; width: 70px; }
.tc .mt { position: absolute; left: 20px; font: 500 22px/1.25 JBMono, monospace; white-space: nowrap; }
.dia { position: absolute; background: currentColor; }
.dia.ac { width: 22px; height: 26px; top: -18px; left: 50%; margin-left: -2px; clip-path: polygon(34% 0, 100% 0, 52% 100%, 0 100%); }
.dia.hk { width: 28px; height: 24px; top: -24px; left: 50%; margin-left: -14px; background: none; border: 6px solid currentColor;
  border-bottom-color: transparent; border-left-color: transparent; border-radius: 50%; transform: rotate(-30deg); }
.dia.hn { width: 13px; height: 26px; top: 10px; left: 76%; border-radius: 7px; transform: rotate(18deg); }

#nem { width: 243px; height: 300px; background: linear-gradient(#141414, #2b2623); color: #fff; }
#tha { width: 240px; height: 285px; background: #2f5bea; color: #fff; }
#truot { width: 240px; height: 282px; background: #7a3cf0; color: #fff; }

/* ---------- bảng dưới: panel đen ---------- */
#panel { position: absolute; left: 0; top: 1012px; width: 1080px; height: 908px; background: #161210;
  background-image: radial-gradient(#2c2621 3px, transparent 3.6px); background-size: 36px 36px; background-position: 14px 12px; }
#ghosttxt { position: absolute; left: -30px; top: 1150px; font: 400 360px/1 Anton, sans-serif; color: #2a241f; letter-spacing: 22px; white-space: nowrap; }
#dash { position: absolute; left: 30px; top: 1050px; width: 1020px; height: 570px; border: 3px dashed #7b756c; border-radius: 26px; opacity: .8; }

#tag2 { position: absolute; left: 40px; top: 1053px; height: 65px; width: 440px; border-radius: 33px; background: #c9451c; border: 3px solid #f1ede6;
  color: #fff; font: 500 36px/59px JBMono, monospace; text-align: center; z-index: 9; }
.bc { position: absolute; left: 0; top: 0; width: 270px; height: 270px; border: 5px solid #141414; border-radius: 24px; box-shadow: 9px 10px 0 #a83a17; }
.bc .gr { position: absolute; left: 20px; top: 20px; width: 40px; height: 22px; background: radial-gradient(currentColor 4.5px, transparent 5.2px) 0 0 / 14px 14px; opacity: .55; }
.bc .lb { position: absolute; left: 22px; top: 150px; font: 800 66px/1 Inter, sans-serif; letter-spacing: -2px; }
.bc .sb { position: absolute; left: 22px; top: 224px; font: 500 21px/1 Inter, sans-serif; opacity: .8; white-space: nowrap; }
#throw { background: #fff; color: #141414; }
#inertia { background: #2f5bea; color: #fff; }
#elastic { background: #e0a312; color: #141414; }
#drag { background: #c9451c; color: #fff; box-shadow: 9px 10px 0 #6e260e; z-index: 5; }
#bounce { background: #7a3cf0; color: #fff; }
#mtile { position: absolute; left: 907px; top: 1047px; width: 112px; height: 108px; border-radius: 24px; background: #fff; border: 5px solid #141414;
  box-shadow: 5px 6px 0 #a83a17; z-index: 8; }
#mtile svg { position: absolute; left: 20px; top: 18px; }
#shade { z-index: 50; background: linear-gradient(to bottom, rgba(78,72,66,.62) 0, rgba(78,72,66,.62) 1014px, rgba(10,8,6,.28) 1014px, rgba(10,8,6,.28) 1920px); }

#tag { position: absolute; left: 130px; top: 128px; font: 500 26px JBMono, monospace; color: #1a1a1a; }
#cap { position: absolute; left: 130px; top: 248px; width: 900px; font: 500 78px/1.08 Inter, sans-serif; color: #f4f1ea; letter-spacing: -1.5px; }
#cap .grp { position: absolute; left: 0; top: 0; width: 900px; opacity: 0; }
#cap span { display: inline-block; opacity: 0; }
#cap em { font: italic 400 96px ISerif, serif; color: #d9501f; letter-spacing: 0; }

/* terminal */
#term { position: absolute; left: 118px; top: 690px; width: 844px; height: 288px; background: #141210; border: 3px solid #3a3530; border-radius: 22px; box-shadow: 0 14px 34px rgba(0,0,0,.45); overflow: hidden; }
#term .hd { position: absolute; left: 0; top: 0; width: 100%; height: 44px; background: #1e1b18; font: 500 21px JBMono, monospace; color: #d6d1c8; }
#term .hd i { position: absolute; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: #6a655d; }
#term .hd span { position: absolute; left: 80px; top: 10px; }
#term .ln { position: absolute; left: 24px; top: 108px; font: 500 60px/1 JBMono, monospace; color: #f4f1ea; white-space: pre; }
#term .ln .d { color: #d9501f; }
#term .cur { display: inline-block; width: 28px; height: 62px; background: #9a958d; vertical-align: -10px; margin-left: 4px; }
#term .mh { position: absolute; right: 22px; bottom: 16px; padding: 4px 16px; border: 3px solid #e9e5dc; border-radius: 24px; font: 500 21px JBMono, monospace; color: #fff; background: #141210; }
#logo { position: absolute; left: 826px; top: 622px; width: 134px; height: 134px; border-radius: 28px; background: #fff; border: 5px solid #141414; box-shadow: 6px 8px 0 #141414; }
#logo svg { position: absolute; left: 10px; top: 10px; }

#mpill { position: absolute; left: 194px; top: 1070px; width: 266px; height: 80px; border-radius: 40px; background: #c9451c; border: 4px solid #f4f1ea;
  font: 500 40px/72px JBMono, monospace; color: #fff; text-align: center; }
#chip { position: absolute; left: 154px; top: 1234px; width: 596px; height: 76px; border-radius: 38px; background: #fff; border: 3px solid #141414;
  font: 700 31px/70px JBMono, monospace; color: #141414; text-align: center; white-space: pre; }
#robot { position: absolute; left: 762px; top: 1088px; width: 160px; height: 156px; border-radius: 28px; background: #fff; border: 5px solid #141414; box-shadow: 6px 8px 0 #141414; }
#robot svg { position: absolute; left: 22px; top: 24px; }
#lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.ring { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 4px solid #d9501f; border-radius: 50%; opacity: 0; }
.dash { position: absolute; width: 5px; height: 26px; background: #d9501f; opacity: 0; border-radius: 3px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920" data-fps="30">
  <div class="clip layer" id="bg" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow data-start="0" data-duration="4.5" data-track-index="0">
    <div id="paper" class="layer"></div>
    <div id="bgdots" class="layer"></div>
    <div id="topg" class="layer">
      <div id="tpaper"></div>
      <div id="bdots"></div><div id="board"></div>
      <div id="pills"></div>
      <div class="tc" id="nem"></div><div class="tc" id="tha"></div><div class="tc" id="truot"></div><div class="tc" id="nay"></div><div class="tc" id="keo"></div>
      <div id="gtile">GSAP</div>
    </div>
    <div id="botg" class="layer">
      <div id="panel"></div><div id="ghosttxt">DRAGGABLE</div><div id="dash"></div><div id="dashline"></div>
      <div class="bc" id="throw"></div><div class="bc" id="inertia"></div><div class="bc" id="elastic"></div><div class="bc" id="drag"></div><div class="bc" id="bounce"></div>
      <div id="mtile"><svg width="64" height="64" viewBox="0 0 64 64"><path d="M6 52 L22 12 L32 12 L16 52Z M26 52 L42 12 L52 12 L36 52Z" fill="#141414"/><circle cx="55" cy="46" r="5" fill="#141414"/></svg></div>
    </div>
  </div>
  <div id="vel" class="clip" data-layout-ignore data-layout-allow-occlusion data-layout-allow-overlap data-start="0" data-duration="4.5" data-track-index="3">velocity <b id="velv">2929</b> px/s</div>
  <div class="clip layer" id="shade" data-layout-allow-occlusion data-layout-ignore data-start="0" data-duration="4.5" data-track-index="1"></div>
  <div class="clip layer" id="fg" data-start="0" data-duration="4.5" data-track-index="2">
    <div id="tag" data-layout-ignore>AI Tips</div>
    <div id="term">
      <div class="hd"><i style="left:18px"></i><i style="left:40px"></i><i style="left:62px"></i><span data-layout-ignore>Terminal</span></div>
      <div class="ln"><span class="d">$ </span><span id="typed"></span><span class="cur" id="cur"></span></div>
      <div class="mh" data-layout-ignore>Minh hoạ</div>
    </div>
    <div id="logo"></div>
    <svg id="lines" viewBox="0 0 1080 1920"><path id="ln1" d="M460 1104 L772 1146" stroke="#d9501f" stroke-width="5" fill="none" stroke-linecap="round"/><path id="ln2" d="M600 1236 L800 1236" stroke="#d9501f" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="3 9"/></svg>
    <div id="mpill" data-layout-allow-occlusion>/motion</div>
    <div id="chip" data-layout-allow-occlusion>MCP  ·  mcp.motion.dev</div>
    <div id="robot"></div>
    <div id="fx" data-layout-allow-occlusion></div>
    <div id="cap"></div>
  </div>
</div>
<script>
const MOTION_SVG = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#141414"/>
<path d="M17 68 L33 36 H46 L30 68Z" fill="#fff"/><path d="M38 68 L54 36 H67 L51 68Z" fill="#fff"/><path d="M59 68 L72 42 Q76 36 70 36 H64 L78 36" fill="#fff"/><circle cx="80" cy="38" r="7" fill="#fff"/></svg>`;
document.getElementById("logo").innerHTML = MOTION_SVG(104);
document.getElementById("robot").innerHTML = `<svg width="106" height="100" viewBox="0 0 106 100"><rect x="10" y="26" width="86" height="56" rx="14" fill="#c9451c"/>
<rect x="30" y="8" width="8" height="22" fill="#c9451c"/><rect x="68" y="8" width="8" height="22" fill="#c9451c"/><rect x="26" y="44" width="16" height="16" rx="4" fill="#fff"/><rect x="64" y="44" width="16" height="16" rx="4" fill="#fff"/>
<rect x="30" y="68" width="46" height="8" rx="4" fill="#fff"/><rect x="0" y="40" width="10" height="26" rx="4" fill="#c9451c"/><rect x="96" y="40" width="10" height="26" rx="4" fill="#c9451c"/></svg>`;

// ---------- nền: đúng khung cuối s13 (J13 khớp-khung) ----------
// Dựng lại bảng thẻ + panel của s13 (mã chép từ ../s13/index.html), chạy timeline s13 tới 3.0 s (= 24.0 gốc)
// rồi giữ nguyên trạng thái đó làm khung đầu; từ đó thẻ "xáo" tiếp như gốc.
const $ = s => document.querySelector(s);
function tcard(id, word, bar, mono, monoTop) {
  $(id).innerHTML = `<div class="big">${[...word].map(ch => `<span>${ch}</span>`).join("")}</div><div class="b1" style="background:${bar}"></div><div class="b2" style="background:${bar}"></div>
    <div class="mt" style="top:${monoTop}px;color:${bar}">${mono}</div>`;
}
tcard("#nem", "NÉM", "#7a746d", "inertia:<br>true", 204);
tcard("#tha", "THẢ", "#bcc9ff", "snap: [ … ]", 232);
tcard("#truot", "TRƯỢT", "#c9b0ff", "throwResistance", 232);
tcard("#nay", "NẢY", "#7a5a05", "bounds", 232);
tcard("#keo", "KÉO", "#f0b9a4", "Draggable", 244);
$("#nem .mt").style.color = "#fff"; $("#tha .mt").style.color = "#fff"; $("#truot .mt").style.color = "#fff"; $("#keo .mt").style.color = "#fff";
$("#nay .mt").style.color = "#141414";
$("#nay .big").style.fontSize = "104px";
$("#truot .big").style.fontSize = "88px";
$("#keo .mt").style.transform = "rotate(-3deg)";
const BC = { throw: ["throw", "power: 0.5"], inertia: ["inertia", "timeConstant: 1500"], elastic: ["elastic", "dragElastic={0.35}"], drag: ["drag", "drag"], bounce: ["bounce", "bounceDamping: 13"] };
Object.keys(BC).forEach(k => {
  $("#" + k).innerHTML = `<div class="gr"></div><div class="lb">${BC[k][0]}</div><div class="sb">${BC[k][1]}</div>`;
});
const PILLS = [["x,y", "k", 22, 518], ["snap", "y", 150, 516], ["inertia", "w", 62, 676], ["cursor", "w", 548, 530], ["minDur", "k", 706, 534],
  ["liveS", "k", 470, 690], ["trigger", "w", 396, 726], ["onDrag", "w", 180, 726], ["bounds", "w", 100, 830], ["velocity", "k", 238, 832],
  ["lockAxis", "w", 380, 832], ["for", "w", 530, 832]];
PILLS.forEach(([t, c, x, y], i) => {
  const p = document.createElement("div"); p.className = "pill " + c; p.id = "pl" + i; p.textContent = t;
  p.style.left = x + "px"; p.style.top = y + "px"; $("#pills").appendChild(p);
});
document.querySelectorAll("#topg *, #botg *").forEach(e => { e.setAttribute("data-layout-allow-occlusion", ""); e.setAttribute("data-layout-allow-overlap", ""); });

function sampleKf(kf, dt) {
  const n = kf.length, out = [];
  const tg = (i, c) => {
    const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1);
    return (kf[b][c] - kf[a][c]) / (kf[b][0] - kf[a][0]);
  };
  for (let t = kf[0][0] + dt; t <= kf[n - 1][0] + 1e-6; t += dt) {
    let i = 0; while (i < n - 2 && kf[i + 1][0] < t - 1e-9) i++;
    const t0 = kf[i][0], t1 = kf[i + 1][0], h = t1 - t0, u = Math.min(1, (t - t0) / h);
    const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
    const v = c => h00 * kf[i][c] + h10 * h * tg(i, c) + h01 * kf[i + 1][c] + h11 * h * tg(i + 1, c);
    out.push({ x: v(1), y: v(2), rotation: v(3), scale: v(4), duration: dt, ease: "none" });
  }
  return out;
}
const tl13 = gsap.timeline({ paused: true });   // chuyển động của s13 (chỉ phần còn thấy được ở 3.0 s)
const DT = 1 / 30;
function follow(sel, w, h, kf, delay) {
  const pts = kf.map(([t, cx, cy, r, s]) => [t, cx - w / 2, cy - h / 2, r, s]);
  tl13.set(sel, { x: pts[0][1], y: pts[0][2], rotation: pts[0][3], scale: pts[0][4] }, 0);
  tl13.to(sel, { keyframes: sampleKf(pts, DT) }, pts[0][0] + (delay || 0));
}
tl13.set("#nem", { x: 292, y: 382 }, 0);
tl13.set("#tha", { x: 828, y: 382 }, 0);
tl13.set("#truot", { x: 562, y: 670 }, 0);
tl13.set("#nay", { x: 828, y: 670 }, 0);
const KEO = [[0, 190, 770, -3, 1], [0.25, 198, 763, -3, 1], [0.5, 684, 612, -8, 1.04], [0.75, 648, 540, -20, 1.06], [1.0, 558, 640, -12, 1.03],
  [1.25, 150, 666, -2, 1], [1.5, 407, 565, -10, 1.02], [1.75, 558, 500, -4, 1], [2.0, 630, 464, -2, 1], [2.25, 648, 457, -3, 1], [2.6, 648, 460, 0, 1], [3.0, 648, 460, 0, 1]];
follow("#keo", 252, 300, KEO, 0);
follow("#nem", 243, 300, [[0, 413, 532, 0, 1], [1.8, 413, 532, 0, 1], [2.0, 390, 490, -2, 1.02], [2.25, 396, 520, -4, 1.03], [2.5, 540, 601, -14, 1.04], [2.75, 560, 612, -12, 1], [3.0, 560, 612, -12, 1]], 0);
PILLS.forEach((_, i) => tl13.to("#pl" + i, { y: "+=" + (8 + (i % 3) * 4), x: "+=" + ((i % 2) ? 10 : -10), duration: 0.9 + (i % 4) * 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.1 + i * 0.03));
tl13.set("#throw", { x: 33, y: 1058 }, 0);
tl13.set("#inertia", { x: 405, y: 1058 }, 0);
follow("#drag", 270, 270, [[0, 330, 1498, 0, 1.0], [0.15, 342, 1494, 0, 1.05], [0.5, 360, 1512, -8, 1.08], [0.75, 515, 1411, -4, 1.08], [1.0, 630, 1314, 2, 1.06],
  [1.25, 684, 1289, 5, 1.05], [1.5, 702, 1285, 4, 1.03], [1.75, 810, 1242, 2, 1.02], [2.0, 871, 1220, 0, 1.0], [2.25, 895, 1204, 0, 1.0], [2.5, 910, 1193, 0, 1.0], [3.0, 910, 1193, 0, 1.0]], 0);
follow("#bounce", 270, 270, [[0, 726, 1477, 0, 1], [0.5, 738, 1519, 0, 1], [0.75, 929, 1530, 4, 1], [1.0, 900, 1512, 0, 1], [1.25, 936, 1523, 2, 1], [1.75, 936, 1544, 0, 1],
  [2.0, 540, 1519, -12, 1], [2.25, 330, 1501, -3, 1], [2.5, 400, 1515, 0, 1], [3.0, 400, 1515, 0, 1]], 0);
follow("#elastic", 270, 270, [[0, 910, 1193, 0, 1], [1.65, 910, 1193, 0, 1], [1.85, 920, 1270, 6, 1], [2.0, 756, 1483, 5, 1], [2.25, 713, 1537, -2, 1], [2.5, 735, 1522, 0, 1], [3.0, 735, 1522, 0, 1]], 0);
tl13.to("#throw", { y: 1034, duration: 0.12, ease: "power2.out" }, 2.72);
tl13.to("#throw", { y: 1058, duration: 0.35, ease: "bounce.out" }, 2.84);
tl13.time(3.0);   // trạng thái đúng 24.0 gốc = khung cuối s13
tl13.kill();      // giữ nguyên style đã vẽ; từ đây chỉ timeline `tl` bên dưới điều khiển

// ---------- phụ đề theo nhịp ----------
const CAPS = [
  { t0: 0.0, t1: 0.2, w: [["Còn", 0], ["<em>Motion,</em>", 0.04]] },
  { t0: 0.2, t1: 0.97, w: [["chạy", 0.2], ["lệnh", 0.3], ["trên", 0.38], ["màn", 0.46], ["<em>hình,</em>", 0.6]] },
  { t0: 0.97, t1: 2.76, w: [["nó", 0.97], ["thêm", 1.06], ["skill", 1.2], ["<em>/motion</em>", 1.4], ["và", 2.0], ["kết", 2.5], ["nối", 2.62]] },
  { t0: 2.76, t1: 4.4, w: [["<em>MCP</em>", 2.78], ["tra", 2.95], ["cứu", 3.05], ["docs", 3.15], ["cho", 3.23], ["Claude", 3.38], ["Code.", 3.88]] }];

const tl = gsap.timeline({ paused: true });
const capEl = document.getElementById("cap");
CAPS.forEach((g, gi) => {
  const el = document.createElement("div"); el.className = "grp"; el.id = "g" + gi;
