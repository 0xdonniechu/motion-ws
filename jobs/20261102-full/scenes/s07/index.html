<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<script src="texture.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#bg { position: absolute; inset: 0; background: #f3f0e9; }
.layer { position: absolute; inset: 0; }

#tag { position: absolute; left: 130px; top: 128px; font: 500 26px JBMono, monospace; color: #1a1a1a; }
#cap { position: absolute; left: 130px; top: 248px; width: 820px; font: 500 78px/1.08 Inter, sans-serif;
  color: #141414; letter-spacing: -1.5px; }
#cap span { display: inline-block; opacity: 0; }

#grid { -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 140px, rgba(0,0,0,1) 560px);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 140px, rgba(0,0,0,1) 560px); }
#gridCv { position: absolute; left: 0; top: 0; }

#gsvg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
#chipG { position: absolute; left: 0; right: 0; top: 1408px; margin: 0 auto; width: max-content; height: 100px; padding: 0 34px;
  border-radius: 50px; background: #131211; color: #fff; font: 700 66px/100px JBMono, monospace; opacity: .5; }
#gdots s { position: absolute; display: block; width: 17px; height: 17px; border-radius: 5px; background: #c4430c; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="1.55" data-width="1080" data-height="1920" data-fps="30">
  <div id="bg"></div>
  <div id="gLayer" class="clip layer" data-start="0" data-duration="1.55" data-track-index="0">
    <svg id="gsvg" viewBox="0 0 1080 1920" width="1080" height="1920">
      <defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4501a"/><stop offset="0.28" stop-color="#c4430c"/><stop offset="1" stop-color="#c4430c"/></linearGradient></defs>
      <g id="gG" transform="translate(540 950)">
        <path id="gh0" fill="none" stroke="#141414" stroke-width="3" d=""/>
        <path id="gh1" fill="none" stroke="#c4430c" stroke-width="4" d=""/>
        <path id="gshp" fill="url(#gl)" stroke="#141414" stroke-width="9" stroke-linejoin="round" d=""/>
      </g>
    </svg>
    <div id="chipG">morphSVG: "#G"</div>
  </div>
  <div id="grid" class="clip layer" data-start="0" data-duration="1.55" data-track-index="1"><canvas id="gridCv" width="1080" height="1920"></canvas></div>
  <div id="gdots" class="clip layer" data-start="0" data-duration="1.55" data-track-index="4"></div>
    <div id="txtLayer" class="clip layer" data-start="0" data-duration="1.55" data-track-index="3">
    <div id="tag">AI Tips</div>
    <div id="cap"><span>cả</span> <span>nghìn</span> <span>ô</span> <span>gợn</span> <span>sóng</span> <span>cùng</span> <span>một</span> <span>lúc.</span></div>
  </div>
</div>
<script>
// ---------- chữ G tĩnh ở khung đầu (cuối cảnh trước) ----------
const rad = d => (d * Math.PI) / 180;
const G = []; { const a = 330, b = 430, ai = 175, bi = 280;
  for (let p = -90; p <= -40; p += 2) G.push([a * Math.cos(rad(p)), b * Math.sin(rad(p))]);
  for (let p = -40; p >= -336; p -= 3) G.push([ai * Math.cos(rad(p)), bi * Math.sin(rad(p))]);
  const iy = bi * Math.sin(rad(24));
  G.push([ai * Math.cos(rad(24)), iy], [20, iy], [20, -10], [a * 0.985, -10]);
  for (let p = -2; p <= 268; p += 3) G.push([a * Math.cos(rad(p)), b * Math.sin(rad(p))]);
  for (let i = 0; i < G.length; i++) G[i] = [G[i][0] - 0.2 * G[i][1] - 20, G[i][1] + 10];
}
const gd = "M" + G.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
["gshp", "gh0", "gh1"].forEach(id => document.getElementById(id).setAttribute("d", gd));

// ---------- lưới halftone: mỗi ô một tween keyframes (xác định, không random) ----------
const P = 36, COLS = 30, ROWS = 54, CX = 540, CY = 960;
function hash(i, j, s) { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
const lerpK = (u, pts) => { // pts: [[u, v], ...]
  if (u <= pts[0][0]) return pts[0][1]; for (let k = 1; k < pts.length; k++) if (u <= pts[k][0]) { const a = pts[k - 1], b = pts[k]; return a[1] + (b[1] - a[1]) * (u - a[0]) / (b[0] - a[0]); }
  return pts[pts.length - 1][1]; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ORG = "#c4430c", BLK = "#141414";

const RX = [[0.05, 0], [0.1, 330], [0.2, 480], [0.3, 640], [0.37, 950], [0.43, 1500]];
// bán kính đĩa đen đo ở gốc (f17–f26 = 28,126,210,305,423,490,525,561,606,646 px; đĩa phủ kín khung ở f27–f28) -> chậm dần thay vì đen kín ở f25
const CYK = [[0, 960], [0.633, 962], [0.667, 974], [0.7, 1011], [0.733, 1055], [0.767, 1107], [0.8, 1156], [0.833, 1196], [0.867, 1240], [0.9, 1300]]; // tâm đĩa đen dịch xuống (đo (mép trên+mép dưới)/2 ở x=540)
const RB = [[0.44, 0], [0.48, 14], [0.52, 45], [0.56, 130], [0.6, 235], [0.65, 405], [0.667, 456], [0.7, 516], [0.733, 558], [0.767, 594], [0.8, 639], [0.833, 679], [0.867, 723], [0.9, 773]]; // = bán kính đo + 33 (mép nhạt dần trong 70px)
const RW = [[0.48, 300], [0.6, 200], [0.7, 140], [0.8, 100], [0.9, 60]];

function field(u, i, j) {
  const x = i * P + P / 2, y = j * P + P / 2, dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy);
  const n1 = hash(i, j, 1), n2 = hash(i, j, 2);
  // giai đoạn 1: đám chấm cam hình trứng nở ra
  if (u < 0.43) {
    const rx = lerpK(u, RX), ry = rx * 1.17;
    const e = Math.hypot((dx + 80 * (0.43 - u)) / (rx || 1), dy / (ry || 1));
    if (rx <= 0) return [0, ORG, 0];
    const edge = 1 + 0.12 * (n1 - 0.5);
    let s = e < edge ? 0.9 + 0.1 * n2 : 0;
    if (e > edge - 0.12 && e < edge) s *= 0.6;
    const wob = (u < 0.3 ? 24 : 6) * (n2 - 0.5);
    let col = ORG;
    if (u > 0.36 && u < 0.46 && r < 100 * sstep(0.34, 0.42, u)) { col = "#7a2a0a"; }
    return [Math.min(1, s), col, wob];
  }
  // giai đoạn 2: gợn sóng + đĩa đen lan ra
  if (u < 0.9) {
    const rb = lerpK(u, RB), w = lerpK(u, RW), rd = Math.hypot(dx, y - lerpK(u, CYK));
    if (u < 0.46 && r < 100) return [0.95, "#7a2a0a", 0];
    if (u < 0.44) return [0.92, ORG, 0];
    if (rd < rb) { const e = sstep(rb - 70, rb, rd); return [0.95 - 0.35 * e, BLK, 0]; }
    if (rd < rb + w) { const t = (rd - rb) / w; return [0.22 + 0.72 * t * t, t < 0.3 ? BLK : ORG, 0]; }
    return [0.92, ORG, 0];
  }
  // giai đoạn 3: toàn đen rồi tan theo mặt quét xiên thành lưới đen-cam
  // Mặt quét đo từ mép trên khối đen (f28–f35): chạy xuống 150 px/khung (≈4500 px/s), bắt đầu ở mép trái ở f28 và trễ dần sang phải
  // (x=980 bắt đầu ở f31: 0.00344 khung/px => mép nghiêng −0.5 px/px). Ô sau mặt quét xoay ~38° (hình thoi) như gốc.
  const tf = (26.65 + 0.00344 * (x - 100)) / 30 + (y - 560) / 4500;
  const tau = u - tf, par = (i + j) % 2 === 0;
  if (tau < 0) return [0.95, BLK, 0];
  const rot = 38 * sstep(0.05, 0.12, tau);
  if (tau < 0.07) return [0.95 - 0.77 * (tau / 0.07), BLK, rot];
  // lưới đen-cam chỉ xuất hiện sau, theo thời gian toàn cục: gốc f34 vùng trên còn kem, f36 gần cả khung là ô đen-cam (quét từ trên xuống trong ~2 khung)
  const g = sstep(0, 0.07, u - (1.087 + (y / 1920) * 0.067));
  return [0.18 + 0.67 * g, g > 0.4 ? (par ? ORG : BLK) : BLK, rot];
}

// ---------- vẽ lưới bằng Canvas, hàm thuần của thời gian (xem TX trong shared/texture.js) ----------
// Gốc: ô 36px, ô vuông bo ~7px kích thước ~34px (khe 2-3px), xoay ngẫu nhiên MỖI KHUNG khi còn là đám chấm (f0–f14: ±40° giảm về 0 ở ~0.5s)
// và dịch vị trí ±4px; lưới đứng yên đều từ f15. Giữa các mốc 18 khung hình vẫn nội suy tuyến tính như bản keyframe cũ.
const gcv = document.getElementById("gridCv"), gx = gcv.getContext("2d");
const DISC = [[0.5, 0], [0.533, 28], [0.567, 126], [0.6, 210], [0.633, 305], [0.667, 423], [0.7, 483], [0.733, 525], [0.767, 561], [0.8, 606], [0.833, 646], [0.867, 690], [0.9, 740]];
// biên độ xoay ±A (độ) đo từ độ tập trung hướng cạnh R của 4θ (R = sin(4A)/(4A)): f1–f2 35, f3–f4 28, f5 31, f6–f12 39–44, f13 35, f14 33, f15 31, f16 30
const JIT = [[0, 35], [0.033, 35], [0.067, 28], [0.1, 28], [0.133, 31], [0.167, 39], [0.2, 42], [0.233, 41], [0.267, 40], [0.3, 39], [0.333, 41], [0.367, 43], [0.4, 35], [0.433, 33], [0.467, 31], [0.5, 30]];
const KN = 40, DUR = 1.3, FPS = 30; // mốc nội suy mỗi ~1 khung
const rgb = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const KF = []; // KF[k][j*COLS+i] = [s, [r,g,b], rot]
for (let k = 0; k < KN; k++) { const u = (k * DUR) / (KN - 1), a = [];
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) { const [s, col, rot] = field(u, i, j); a.push([s, rgb(col), rot]); }
  KF.push(a); }
const GT = { t: 0 };
function drawGrid() {
  const t = Math.min(DUR, GT.t), x = (t / DUR) * (KN - 1), k = Math.min(KN - 2, Math.floor(x)), f = x - k, fr = Math.floor(GT.t * FPS + 1e-6);
  const EDGE = lerpK(t, DISC); // bán kính đĩa đen đo được
  const jit = (r) => { // biên độ xoay ngẫu nhiên mỗi khung (đều ±A độ)
    if (t < 0.5) return lerpK(t, JIT);                            // đám chấm (f1–f16): ±A đo từ hướng cạnh (JIT)
    if (t < 0.533 || r < EDGE) return 0;                         // bên trong đĩa đen: ô thẳng hàng (đo: độ lệch chuẩn 0–1°)
    return t < 0.7 ? 43 : t < 0.767 ? 43 - (t - 0.7) / 0.067 * 31 : t < 0.9 ? 12 * (1 - (t - 0.767) / 0.133) : 0; // ngoài đĩa: độ lệch chuẩn 22–29° (≈ ±43° đều) ở f17–f22, về ~7° ở f24–f26
  };
  gx.clearRect(0, 0, 1080, 1920);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const n = j * COLS + i, A = KF[k][n], B = KF[k + 1][n];
    const s = A[0] + (B[0] - A[0]) * f;
    if (s < 0.02) continue;
    const c = [0, 1, 2].map(q => Math.round(A[1][q] + (B[1][q] - A[1][q]) * f));
    const rr = Math.hypot(i * P + P / 2 - CX, j * P + P / 2 - lerpK(t, CYK)), ja = jit(rr);
    const rot = A[2] + (B[2] - A[2]) * f + (ja > 0.3 ? (hash(i, j, 300 + fr) - 0.5) * 2 * ja : 0);
    const z = 34.5 * Math.min(1, s * 1.05);
    gx.save(); gx.translate(i * P + P / 2, j * P + P / 2); gx.rotate(rot * Math.PI / 180);
    gx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; gx.beginPath(); gx.roundRect(-z / 2, -z / 2, z, z, 7); gx.fill(); gx.restore();
  }

  // cung trắng quét qua (gốc f37–f39 = 9.1s): dải dày ~76px, phần trái nằm ngang rồi dốc lên phải (−0.35), đầu mút tròn,
  // tụt xuống 152 px/khung (trái: y 1628 → 1780 → ~1930), dài ra sang phải (đầu phải x ≈ 870 → 1050 → ...)
  const FA = t * FPS + 1;
  if (FA > 36.6 && FA < 39.7) {
    const y0 = 1628 + 152 * (FA - 37), xe = Math.min(1250, 870 + 180 * (FA - 37));
    gx.save(); gx.strokeStyle = "#f1ede5"; gx.lineWidth = 76; gx.lineCap = "round"; gx.lineJoin = "round";
    gx.beginPath(); gx.moveTo(-40, y0); gx.lineTo(200, y0); gx.lineTo(xe, y0 - 0.35 * (xe - 200)); gx.stroke(); gx.restore();
  }
}

// ---------- timeline ----------
const POST = 0.25;
const main = gsap.timeline({ paused: true });
const tl = gsap.timeline();
tl.fromTo(GT, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: drawGrid, immediateRender: false }, 0);

// J6: chữ G tan thành mây chấm cam. Khung đầu = G đặc (khớp cuối s06); các chấm lấy mẫu trong đúng hình G
function inG(x, y) { let c = false; for (let a = 0, b = G.length - 1; a < G.length; b = a++) {
  const [xi, yi] = G[a], [xj, yj] = G[b]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
const gdots = document.getElementById("gdots"), GP = 20;
for (let yy = -440; yy <= 460; yy += GP) for (let xx = -420; xx <= 400; xx += GP) {
  if (!inG(xx, yy)) continue;
  const i = Math.round((xx + 420) / GP), j = Math.round((yy + 440) / GP);
  const el = document.createElement("s"); el.style.left = (540 + xx - 8.5) + "px"; el.style.top = (950 + yy - 8.5) + "px"; gdots.appendChild(el);
  const h1 = hash(i, j, 11), h2 = hash(i, j, 12), h3 = hash(i, j, 13);
  const t0 = h3 * 0.08;
  tl.fromTo(el, { scale: 1, x: 0, y: 0, opacity: 1 },
    { scale: 0.35 + 0.8 * h1, x: (h1 - 0.5) * 170 - xx * 0.08, y: (h2 - 0.5) * 150 - yy * 0.05, duration: 0.3, ease: "power2.inOut" }, t0);
  tl.to(el, { opacity: 0, duration: 0.1, ease: "none" }, 0.2 + h2 * 0.08);
}
tl.fromTo("#gG", { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power1.in" }, 0.03);
tl.fromTo("#chipG", { opacity: 0.5 }, { opacity: 0, duration: 0.05 }, 0);

// phụ đề
const capT = [0.0, 0.07, 0.2, 0.3, 0.4, 0.6, 0.7, 0.8];
// "cả" đã mờ từ khung cuối s06; "nghìn" mờ ngay khung đầu (gốc f237) => không có khung trống tại mốc cắt
document.querySelectorAll("#cap span").forEach((s, i) => {
  if (i === 0) tl.fromTo(s, { opacity: 0.75, y: 0, color: "#4a4742" }, { opacity: 1, y: 0, color: "#141414", duration: 0.05, ease: "none" }, 0);
  else if (i === 1) tl.fromTo(s, { opacity: 0.45, y: 0, color: "#77736c" }, { opacity: 1, y: 0, color: "#141414", duration: 0.06, ease: "none" }, 0);
  else tl.fromTo(s, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out" }, capT[i]);
});

window.__timelines = window.__timelines || {};
// J7 (post): giữ lưới đen-cam đến hết post (s08 đè lên bằng mép quét chéo)
main.add(tl, 0);
main.to({}, { duration: 1.3 + POST }, 0);
window.__timelines["main"] = main;
</script>
</body>
</html>
