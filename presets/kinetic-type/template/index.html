<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #141414; }
body { font-family: system-ui, sans-serif; }
#root { position: relative; width: 1280px; height: 720px; }
.clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.big { font-weight: 900; color: #f2f2f2; font-size: 130px; text-align: center; line-height: 1.1; }
.big b { color: #e8c547; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1280" data-height="720" data-fps="30">
<div class="clip" data-start="0" data-duration="3" data-track-index="1"><div class="big node" id="w1">TỪ KHÓA <b>MỘT</b></div></div>
<div class="clip" data-start="3" data-duration="3" data-track-index="1"><div class="big node" id="w2">TỪ KHÓA <b>HAI</b></div></div>
<div class="clip" data-start="6" data-duration="3" data-track-index="1"><div class="big node" id="w3">TỪ KHÓA <b>BA</b></div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#w1", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.2);
tl.fromTo("#w2", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.2);
tl.fromTo("#w3", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 6.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
