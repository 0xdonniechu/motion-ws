<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #efe9dc; }
body { font-family: system-ui, sans-serif; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
#root { position: relative; width: 1080px; height: 1920px; }
.clip { position: absolute; inset: 0; }
#stage { position: absolute; left: 140px; top: 500px; }
#lname { position: absolute; top: 200px; width: 1080px; text-align: center; font-size: 110px; font-weight: 900; color: #e8542f; }
#lsub { position: absolute; top: 1450px; width: 1080px; text-align: center; font-size: 50px; color: #333; font-weight: 700; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
<div class="clip" data-start="0" data-duration="8" data-track-index="1">
<div id="lname" class="node">LỚP GIỮA</div>
<svg id="stage" class="node" viewBox="0 0 800 800" width="800" height="800">
<g id="P2"><ellipse cx="400" cy="640" rx="180" ry="30" fill="#fff" stroke="#999" stroke-width="3"/><rect x="270" y="470" width="260" height="150" rx="12" fill="#e3e3e3" stroke="#999" stroke-width="3"/></g>
<g id="P1"><ellipse cx="400" cy="400" rx="140" ry="24" fill="#f4f4f4" stroke="#999" stroke-width="3"/><rect x="296" y="424" width="208" height="52" rx="10" fill="#6b4226"/></g>
<g id="P0"><ellipse cx="400" cy="280" rx="150" ry="26" fill="#efefef" stroke="#999" stroke-width="3"/></g>
<g id="plabels" class="mono" font-size="30" fill="#333">
<line x1="550" y1="280" x2="644" y2="280" stroke="#999" stroke-width="2"/><text x="656" y="291">nắp</text>
<line x1="540" y1="400" x2="644" y2="400" stroke="#999" stroke-width="2"/><text x="656" y="411">lớp giữa</text>
<line x1="530" y1="550" x2="644" y2="550" stroke="#999" stroke-width="2"/><text x="656" y="561">thân</text>
</g>
</svg>
<div id="lsub" class="node">công dụng lớp giữa</div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#P2", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
tl.fromTo("#P1", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.1);
tl.fromTo("#P0", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.7);
tl.fromTo("#plabels", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.3);
tl.fromTo("#lname", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.8);
tl.fromTo("#lsub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.3);
window.__timelines["main"] = tl;
</script>
</body>
</html>
