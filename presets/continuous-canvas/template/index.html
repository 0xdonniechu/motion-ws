<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=3840, height=2160">
<script src="gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #141414; }
body { font-family: system-ui, sans-serif; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
#root { position: relative; width: 1280px; height: 720px; }
.clip { position: absolute; inset: 0; overflow: hidden; }
#world { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; background: #efe9dc;
background-image: repeating-linear-gradient(0deg, #e2d9c6 0 1px, transparent 1px 60px),
repeating-linear-gradient(90deg, #e2d9c6 0 1px, transparent 1px 60px); }
.node { position: absolute; }
.big { font-weight: 900; color: #1c1c1c; text-align: center; line-height: 1.1; }
.badge { background: #1c1c1c; color: #ffd23f; font-weight: 800; border-radius: 16px; text-align: center; }
.cardbox { background: #fff; border: 3px solid #222; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #222; text-align: center; }
.arr { color: #5f5f5f; font-weight: 900; }
#jdot { width: 26px; height: 26px; border-radius: 50%; background: #e8542f; }
#cta { background: #1c1c1c; color: #fff; border-radius: 24px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1280" data-height="720" data-fps="30">
<div class="clip" data-start="0" data-duration="12" data-track-index="1">
<div id="world" class="node" data-layout-allow-overflow>
<svg width="3840" height="2160" style="position:absolute;left:0;top:0">
<path d="M100,800 L3740,800" fill="none" stroke="#e8542f" stroke-width="5" stroke-dasharray="24,18" opacity="0.55"/>
</svg>
<div id="jdot" class="node" style="left:100px;top:787px;"></div>
<div id="Abadge" class="badge mono node" style="left:440px;top:850px;width:400px;font-size:40px;padding:16px;">★ BẢN ĐỒ LỚN</div>
<div id="Atitle" class="big node" style="left:240px;top:1090px;width:800px;font-size:120px;">MỘT BỨC<br>TRANH</div>
<div id="Asub" class="node mono" style="left:240px;top:1410px;width:800px;text-align:center;font-size:36px;color:#555;">camera đi qua 3 vùng</div>
<div id="B1" class="cardbox node" style="left:1575px;top:1140px;width:180px;height:170px;font-size:34px;">BƯỚC 1</div>
<div id="Ba1" class="arr node" style="left:1757px;top:1195px;width:76px;text-align:center;font-size:48px;">→</div>
<div id="B2" class="cardbox node" style="left:1835px;top:1140px;width:180px;height:170px;font-size:34px;">BƯỚC 2</div>
<div id="Ba2" class="arr node" style="left:2017px;top:1195px;width:66px;text-align:center;font-size:48px;">→</div>
<div id="B3" class="cardbox node" style="left:2085px;top:1140px;width:180px;height:170px;font-size:34px;">BƯỚC 3</div>
<div id="Bcap" class="node mono" style="left:1575px;top:1350px;width:690px;text-align:center;font-size:36px;line-height:44px;height:44px;color:#555;">vùng giữa: quy trình</div>
<div id="Ct" class="big node" style="left:2800px;top:1000px;width:800px;font-size:130px;color:#e8542f;">XONG</div>
<div id="Cs" class="node" style="left:2800px;top:1270px;width:800px;text-align:center;font-size:40px;font-weight:700;">cả bản đồ trong 1 khung hình</div>
<div id="cta" class="node" style="left:2950px;top:1340px;width:500px;font-size:36px;padding:20px;">xem lại từ đầu?</div>
</div>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.set("#world", { transformOrigin: "0 0", scale: 0.3333, x: 0, y: 0 }, 0);
tl.to("#jdot", { x: 3640, duration: 12, ease: "none" }, 0);
tl.to("#world", { scale: 1, x: 0, y: -720, duration: 1.5, ease: "power2.inOut" }, 2);
tl.fromTo("#Atitle", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 3.4);
tl.to("#world", { x: -1280, duration: 1, ease: "power2.inOut" }, 5.5);
tl.fromTo("#B1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.4);
tl.fromTo("#B2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.7);
tl.fromTo("#B3", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.0);
tl.to("#world", { x: -2560, duration: 1, ease: "power2.inOut" }, 8.5);
tl.fromTo("#Ct", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 9.4);
tl.fromTo("#cta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.2);
window.__timelines["main"] = tl;
</script>
</body>
</html>
